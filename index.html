// ── Supabase-compatible Firestore adapter ──
const parseQS=(qs)=>{
  if(!qs)return{};
  const p={};
  qs.split("&").forEach(part=>{const i=part.indexOf("=");if(i>0)p[part.slice(0,i)]=part.slice(i+1);});
  return p;
};
const parseVal=(raw)=>{
  if(raw==="true")return true;
  if(raw==="false")return false;
  if(raw==="null")return null;
  return raw;
};
const db=async(path,opts={})=>{
  const[col,qs]=path.split("?");
  const params=parseQS(qs);
  const method=opts.method||"GET";
  const body=opts.body?JSON.parse(opts.body):null;
  const colRef=fdb.collection(col);

  // ── GET ──
  if(method==="GET"){
    let q=colRef;
    let hasFilter=false;
    for(const[k,v]of Object.entries(params)){
      if(["order","limit","select"].includes(k))continue;
      if(v.startsWith("eq.")){
        hasFilter=true;
        const val=parseVal(v.slice(3));
        if(k==="id")q=q.where(firebase.firestore.FieldPath.documentId(),"==",String(val));
        else q=q.where(k,"==",val);
      }else if(v.startsWith("is.")){
        hasFilter=true;q=q.where(k,"==",parseVal(v.slice(3)));
      }else if(v.startsWith("gte.")){
        hasFilter=true;q=q.where(k,">=",v.slice(4));
      }else if(v.startsWith("lt.")){
        hasFilter=true;q=q.where(k,"<",v.slice(3));
      }else if(v.startsWith("lte.")){
        hasFilter=true;q=q.where(k,"<=",v.slice(4));
      }else if(v.startsWith("gt.")&&k!=="id"){
        hasFilter=true;q=q.where(k,">",v.slice(3));
      }
      // id=gt.0 → skip (delete-all marker only)
    }
    if(params.order&&!hasFilter){
      const i=params.order.lastIndexOf(".");
      const field=params.order.slice(0,i);
      const dir=params.order.slice(i+1)==="desc"?"desc":"asc";
      const f=field==="id"?firebase.firestore.FieldPath.documentId():field;
      q=q.orderBy(f,dir);
      if(params.limit)q=q.limit(Number(params.limit));
    }
    const snap=await q.get();
    let results=snap.docs.map(d=>({id:d.id,...d.data()}));
    // Client-side sort when field filters exist (avoids composite index requirement)
    if(params.order&&hasFilter){
      const i=params.order.lastIndexOf(".");
      const field=params.order.slice(0,i);
      const dir=params.order.slice(i+1)==="desc"?-1:1;
      const sf=field==="id"?"created_at":field;
      results.sort((a,b)=>{const va=a[sf]??"",vb=b[sf]??"";return va<vb?-dir:va>vb?dir:0;});
      if(params.limit)results=results.slice(0,Number(params.limit));
    }
    return results;
  }

  // ── POST (INSERT) ──
  if(method==="POST"){
    const now=new Date().toISOString();
    if(Array.isArray(body)){
      if(!body.length)return[];
      const batch=fdb.batch();const results=[];
      body.forEach(item=>{
        const{id:_,...rest}=item;
        const ref=colRef.doc();
        const data={...rest,created_at:now};
        batch.set(ref,data);results.push({id:ref.id,...data});
      });
      await batch.commit();return results;
    }else{
      const{id:bodyId,...rest}=body||{};
      const useId=bodyId&&isNaN(Number(bodyId));
      const ref=useId?colRef.doc(String(bodyId)):colRef.doc();
      const data={...rest,created_at:now};
      await ref.set(data);return[{id:ref.id,...data}];
    }
  }

  // ── PATCH (UPDATE) ──
  if(method==="PATCH"){
    let docId=null;
    for(const[k,v]of Object.entries(params)){
      if(k==="id"&&v.startsWith("eq.")){docId=v.slice(3);break;}
    }
    if(!docId)return[];
    const ref=colRef.doc(docId);
    const snap=await ref.get();
    if(!snap.exists)return[];
    await ref.update(body);
    const updated=await ref.get();
    return[{id:updated.id,...updated.data()}];
  }

  // ── DELETE ──
  if(method==="DELETE"){
    let directId=null,deleteAll=false;
    const filters=[];
    for(const[k,v]of Object.entries(params)){
      if(k==="id"&&v.startsWith("eq."))directId=v.slice(3);
      else if(k==="id"&&v.startsWith("gt."))deleteAll=true;
      else if(v.startsWith("eq."))filters.push([k,"==",parseVal(v.slice(3))]);
      else if(v.startsWith("gte."))filters.push([k,">=",v.slice(4)]);
      else if(v.startsWith("lt."))filters.push([k,"<",v.slice(3)]);
      else if(v.startsWith("gt.")&&k!=="id")filters.push([k,">",v.slice(3)]);
    }
    if(directId){await colRef.doc(directId).delete();return[];}
    let q=colRef;
    filters.forEach(([k,op,v])=>{q=q.where(k,op,v);});
    const snap=await q.get();
    if(snap.empty)return[];
    const docs=snap.docs;
    for(let i=0;i<docs.length;i+=499){
      const batch=fdb.batch();
      docs.slice(i,i+499).forEach(d=>batch.delete(d.ref));
      await batch.commit();
    }
    return[];
  }
  return[];
};

const saveSettingsDB=async(s)=>{
  try{
    // نطلب الصف المُحدَّث للتأكد من أن PATCH أثّر فعلاً على صف موجود
    const updated=await db("settings?id=eq.main",{method:"PATCH",body:JSON.stringify({data:s}),prefer:"return=representation"});
    if(!updated||updated.length===0){
      // لا يوجد صف "main" بعد → ننشئه
      await db("settings",{method:"POST",body:JSON.stringify({id:"main",data:s}),prefer:"return=minimal"});
    }
  }catch(e){
    // إذا فشل الـPATCH (مثلاً خطأ شبكة/صلاحيات) جرّب INSERT كحل بديل
    try{await db("settings",{method:"POST",body:JSON.stringify({id:"main",data:s}),prefer:"return=minimal"});}catch(e2){}
  }
};

// ── Pagination Component ──
function Pagination({page,pages,onChange,T}){
  if(pages<=1)return null;
  const ac=T?.accent||"#3B82F6";
  return(
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:6,padding:"14px 0"}}>
      <button onClick={()=>onChange(1)} disabled={page===1} className="btn" style={{padding:"5px 10px",background:page===1?"#1A2640":"#1A2640",color:page===1?"#3A5070":"#6B8AAF",border:"1px solid #1E2D45",fontSize:12}}>«</button>
      <button onClick={()=>onChange(page-1)} disabled={page===1} className="btn" style={{padding:"5px 12px",background:"#1A2640",color:page===1?"#3A5070":"#6B8AAF",border:"1px solid #1E2D45",fontSize:12}}>‹</button>
      {(()=>{
        const maxBtns=Math.min(pages,5);
        let start=Math.max(1,page-2);
        let end=start+maxBtns-1;
        if(end>pages){end=pages;start=Math.max(1,end-maxBtns+1);}
        const nums=[];
        for(let p=start;p<=end;p++)nums.push(p);
        return nums.map(p=>(
          <button key={p} onClick={()=>onChange(p)} className="btn"
            style={{padding:"5px 10px",background:p===page?ac:"#1A2640",color:p===page?"#fff":"#6B8AAF",border:"1px solid "+(p===page?ac:"#1E2D45"),fontSize:12,minWidth:32}}>
            {p}
          </button>
        ));
      })()}
      <button onClick={()=>onChange(page+1)} disabled={page===pages} className="btn" style={{padding:"5px 12px",background:"#1A2640",color:page===pages?"#3A5070":"#6B8AAF",border:"1px solid #1E2D45",fontSize:12}}>›</button>
      <button onClick={()=>onChange(pages)} disabled={page===pages} className="btn" style={{padding:"5px 10px",background:"#1A2640",color:page===pages?"#3A5070":"#6B8AAF",border:"1px solid #1E2D45",fontSize:12}}>»</button>
      <span style={{fontSize:11,color:"#4A5E7A",marginRight:4}}>{page} / {pages}</span>
    </div>
  );
}

  const [crFrom,setCrFrom]=useState("");
  const [crTo,setCrTo]=useState("");
  // report range
  const [rng,setRng]=useState("month");
  // activity log clear
  const [logFrom,setLogFrom]=useState("");
  const [logTo,setLogTo]=useState("");

  const toast=(msg,type="success")=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  };

  const login=(user)=>{
    sessionStorage.setItem("aa","1");
    sessionStorage.setItem("cu",JSON.stringify(user));
    setCurrentUser(user);
    setAuth(true);
    logActivity(user.name||user.id,"دخول","دخل النظام");
  };
  const logout=()=>{
    logActivity(currentUser?.name||userRole,"خروج","خرج من النظام");
    sessionStorage.removeItem("aa");
    sessionStorage.removeItem("cu");
    setAuth(false);
  };

  const load=async()=>{
    setLoading(true);
    try{
      const [pr,iv,li,cu,su,pu,dbSettings,logs,cp,ac,jn,jl]=await Promise.all([
        db("products?order=created_at.desc"),
        db("invoices?order=created_at.desc"),
        db("invoice_lines"),
        db("customers?order=created_at.desc").catch(()=>[]),
        db("suppliers?order=created_at.desc").catch(()=>[]),
        db("purchases?order=created_at.desc").catch(()=>[]),
        fetchSettingsDB(),
        db("activity_log?order=created_at.desc&limit=200").catch(()=>[]),
        db("credit_payments?order=created_at.desc").catch(()=>[]),
        db("accounts?order=code.asc").catch(()=>[]),
        db("journals?order=date.desc").catch(()=>[]),
        db("journal_lines?order=created_at.asc").catch(()=>[]),
      ]);
      if(dbSettings){setSettings(dbSettings);setStForm(dbSettings);}
      setProducts(pr.map(p=>({...p,minStock:p.min_stock||5})));
      setInvoices(iv.map(inv=>({...inv,invoiceNo:inv.invoice_no,
        lines:li.filter(l=>l.invoice_id===inv.id).map(l=>({...l,productId:l.product_id,productName:l.product_name}))})));
      setCustomers(cu);setSuppliers(su);setPurchases(pu);setActLog(logs);setCreditPayments(cp);
      setAccounts(ac);setJournals(jn);setJournalLines(jl);
    }catch(e){toast("خطأ في التحميل","error");}
    setLoading(false);
  };
  useEffect(()=>{if(auth)load();},[auth]);
  // theme
  useEffect(()=>{
    document.body.classList.remove("dark","light");
    document.body.classList.add(darkMode?"dark":"light");
    localStorage.setItem("mto_theme",darkMode?"dark":"light");
  },[darkMode]);
  // تحميل الإعدادات من Supabase قبل شاشة الدخول
  useEffect(()=>{
    fetchSettingsDB().then(s=>{
      if(s){setSettings(s);setStForm(s);}
      setSettingsLoading(false);
    });
  },[setSettings,setStForm,setSettingsLoading]);
  useEffect(()=>{document.title=settings.storeName;},[settings.storeName]);
  // إشعار المخزون المنخفض
  useEffect(()=>{
    if(!auth||products.length===0)return;
    const prev=prevLowStockRef.current;
    const curr=products.filter(p=>p.stock<=p.minStock).map(p=>p.id);
    const newLow=curr.filter(id=>!prev.includes(id));
    if(newLow.length>0){
      // إشعار صوتي
      try{
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        [523,440,349].forEach((freq,i)=>{
          const o=ctx.createOscillator();const g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=freq;o.type="sine";
          g.gain.setValueAtTime(0.3,ctx.currentTime+i*0.18);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.18+0.25);
          o.start(ctx.currentTime+i*0.18);o.stop(ctx.currentTime+i*0.18+0.25);
        });
      }catch(e){}
      // إشعار مرئي
      const names=products.filter(p=>newLow.includes(p.id)).map(p=>p.name).join("، ");
      toast("⚠️ مخزون منخفض: "+names,"warning");
    }
    prevLowStockRef.current=curr;
  },[products]);

  // stats
  const sales=useMemo(()=>invoices.filter(i=>!i.is_return),[invoices]);
  const returns=useMemo(()=>invoices.filter(i=>i.is_return),[invoices]);
  const totalRev=useMemo(()=>sales.reduce((a,i)=>a+Number(i.total),0),[sales]);
  const totalRet=useMemo(()=>returns.reduce((a,i)=>a+Number(i.total),0),[returns]);
  const netRev=totalRev-totalRet;
  const totalProfit=useMemo(()=>sales.reduce((a,inv)=>a+(inv.lines||[]).reduce((b,l)=>{
    const p=products.find(p=>p.id===l.productId);
    return b+(p?(Number(l.price)-Number(p.cost))*Number(l.qty):0);
  },0),0),[sales,products]);
  const lowStock=useMemo(()=>products.filter(p=>p.stock<=p.minStock),[products]);
  const invVal=useMemo(()=>products.reduce((a,p)=>a+Number(p.stock)*Number(p.cost),0),[products]);
  const cats=useMemo(()=>[...new Set(products.map(p=>p.category).filter(Boolean))],[products]);

  const prodPerf=useMemo(()=>products.map(prod=>{
    const ll=sales.flatMap(inv=>(inv.lines||[]).filter(l=>Number(l.productId)===Number(prod.id)));
    return{...prod,rev:ll.reduce((a,l)=>a+Number(l.subtotal),0),qty:ll.reduce((a,l)=>a+Number(l.qty),0),profit:ll.reduce((a,l)=>a+(Number(l.price)-Number(prod.cost))*Number(l.qty),0)};
  }).sort((a,b)=>b.rev-a.rev),[products,sales]);

  // months chart data
  const months6=useMemo(()=>{
    const MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    const now=new Date();
    return Array.from({length:6},(_,i)=>{
      const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);
      const m=d.getMonth(),y=d.getFullYear();
      const v=sales.filter(inv=>{const[iy,im]=inv.date.split("-").map(Number);return im-1===m&&iy===y;}).reduce((a,inv)=>a+Number(inv.total),0);
      return{l:MN[m].slice(0,3),v};
    });
  },[sales]);

  // report data
  const reportInvs=useMemo(()=>{
    const now=new Date();
    let from=new Date();
    if(rng==="today") from=new Date(now.toDateString());
    else if(rng==="week") from=new Date(now-7*864e5);
    else if(rng==="month") from=new Date(now.getFullYear(),now.getMonth(),1);
    else if(rng==="year") from=new Date(now.getFullYear(),0,1);
    return sales.filter(i=>{const[iy,im,id]=i.date.split("-").map(Number);const d=new Date(iy,im-1,id);return d>=from;});
  },[sales,rng]);

  // filtered invoices
  const filtInvs=useMemo(()=>invoices.filter(inv=>{
    if(icust&&!inv.customer.includes(icust)) return false;
    if(ifrom&&inv.date<ifrom) return false;
    if(ito&&inv.date>ito) return false;
    if(search&&!((inv.invoiceNo||"")+(inv.customer||"")).toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }),[invoices,icust,ifrom,ito,search]);

  // save product
  const saveProd=async()=>{
    if(!pf.name||!pf.sku||pf.price===""||pf.stock===""){toast("يرجى ملء الحقول المطلوبة","error");return;}
    setBusy(true);
    try{
      const body={name:pf.name,sku:pf.sku,category:pf.category,price:+pf.price,cost:+pf.cost||0,stock:+pf.stock,min_stock:+pf.minStock||5,unit:pf.unit||"قطعة",expiry:pf.expiry||null,notes:pf.notes||""};
      if(modal==="editP"&&md) await db("products?id=eq."+md.id,{method:"PATCH",body:JSON.stringify(body)});
      else await db("products",{method:"POST",body:JSON.stringify(body)});
      toast(modal==="editP"?"تم التحديث ✓":"تمت الإضافة ✓");
      logActivity(currentUser?.name||"مدير",modal==="editP"?"تعديل منتج":"إضافة منتج",pf.name);
      setPf(EP);setModal(null);setMd(null);await load();
    }catch(e){toast("حدث خطأ","error");}
    setBusy(false);
  };

  const delProd=async(id)=>{
    if(!confirm("حذف هذا المنتج؟"))return;
    try{await db("products?id=eq."+id,{method:"DELETE",prefer:"return=minimal"});toast("تم الحذف ✓");logActivity(currentUser?.name||"مدير","حذف منتج","id: "+id);setModal(null);setMd(null);await load();}
    catch(e){toast("لا يمكن حذف منتج مرتبط بفاتورة","error");}
  };

  // invoice calc
  const invSub=useMemo(()=>invL.reduce((a,l)=>{
    const p=products.find(p=>p.id===+l.pid);
    return a+(p&&l.qty?Number(p.price)*+l.qty:0);
  },0),[invL,products]);
  const invDiscAmt=(invSub*(+invD||0))/100;
  const invAfterDisc=invSub-invDiscAmt;
  const invTaxRate=Number(settings.taxRate)||0;
  const invTaxAmt=invTaxRate>0?invAfterDisc*invTaxRate/100:0;
  const invTot=invAfterDisc+invTaxAmt;

  const saveInv=async()=>{
    if(!invC.trim()){toast("يرجى إدخال اسم العميل","error");return;}
    const valid=invL.filter(l=>l.pid&&+l.qty>0);
    if(!valid.length){toast("أضف منتجاً واحداً على الأقل","error");return;}
    setBusy(true);
    try{
      const lines=valid.map(l=>{const p=products.find(p=>p.id===+l.pid);return{pid:p.id,pname:p.name,qty:+l.qty,price:Number(p.price),sub:Number(p.price)*+l.qty};});
      // ✅ إصلاح #1: تجميع الكمية الإجمالية المطلوبة لكل منتج (في حال تكرار المنتج في أكثر من سطر بالفاتورة)
      const totalQtyByProduct={};
      lines.forEach(l=>{totalQtyByProduct[l.pid]=(totalQtyByProduct[l.pid]||0)+l.qty;});
      // ✅ إصلاح #4: التحقق من المخزون الحالي من قاعدة البيانات مباشرة قبل تأكيد الفاتورة (بالكمية الإجمالية لكل منتج)
      for(const pid of Object.keys(totalQtyByProduct)){
        const [fresh]=await db("products?id=eq."+pid+"&select=stock");
        const need=totalQtyByProduct[pid];
        if(fresh&&need>fresh.stock){
          const pname=(lines.find(l=>String(l.pid)===String(pid))||{}).pname||"";
          toast("الكمية تتجاوز المخزون: "+pname+" (المتاح: "+fresh.stock+"، المطلوب: "+need+")","error");
          setBusy(false);return;
        }
      }
      const sub=lines.reduce((a,l)=>a+l.sub,0);
      const disc=(sub*(+invD||0))/100;
      const afterDisc=sub-disc;
      const taxRate=Number(settings.taxRate)||0;
      const taxAmt=taxRate>0?afterDisc*taxRate/100:0;
      const total=afterDisc+taxAmt;
      const prefix=settings.invoicePrefix||"INV";
      // ✅ إصلاح #1: نجيب أعلى رقم فاتورة من قاعدة البيانات مباشرة لتفادي التكرار عند الحذف
      const allInvs=await db("invoices?select=invoice_no&is_return=eq.false&order=id.desc&limit=1");
      let nextNum=1;
      if(allInvs.length>0){
        const last=allInvs[0].invoice_no||"";
        const m=last.match(/(\d+)$/);
        if(m) nextNum=parseInt(m[1],10)+1;
      }
      const no=prefix+"-"+String(nextNum).padStart(4,"0");
      const invBody={invoice_no:no,customer:invC,total,discount:+invD||0,notes:invN+(invPayType==="credit"?" [آجل]":""),date:today(),is_return:false};
      const [ni]=await db("invoices",{method:"POST",body:JSON.stringify(invBody)});
      // ✅ إصلاح #5: في حال فشل إضافة بنود الفاتورة، نحذف الفاتورة الناقصة لتجنب ترك سجل بلا بنود
      try{
        await db("invoice_lines",{method:"POST",body:JSON.stringify(lines.map(l=>({invoice_id:ni.id,product_id:l.pid,product_name:l.pname,qty:l.qty,price:l.price,subtotal:l.sub,note:""})))});
      }catch(lineErr){
        await db("invoices?id=eq."+ni.id,{method:"DELETE",prefer:"return=minimal"}).catch(()=>{});
        throw lineErr;
      }
      // ✅ إصلاح #1 و#3: نجيب المخزون الحالي من قاعدة البيانات مباشرة قبل الخصم، ونخصم الكمية الإجمالية لكل منتج دفعة واحدة
      for(const pid of Object.keys(totalQtyByProduct)){
        const [fresh]=await db("products?id=eq."+pid+"&select=stock");
        if(fresh) await db("products?id=eq."+pid,{method:"PATCH",body:JSON.stringify({stock:fresh.stock-totalQtyByProduct[pid]})});
      }
      const ex=customers.find(c=>c.name===invC);
      if(!ex) await db("customers",{method:"POST",body:JSON.stringify({name:invC,phone:"",notes:""})}).catch(()=>{toast("⚠️ تم إصدار الفاتورة لكن فشلت إضافة العميل تلقائياً","warning");});
      // handle credit payment
      if(invPayType==="credit"){
        const paidNow=invPaidAmt!==""?Math.min(Number(invPaidAmt),total):0;
        if(paidNow>0){
          await db("credit_payments",{method:"POST",body:JSON.stringify({customer_name:invC,amount:paidNow,notes:"دفعة مقدمة مع الفاتورة "+no,date:today(),invoice_no:no}),prefer:"return=minimal"}).catch(()=>{});
        }
      }
      toast("✓ فاتورة "+no+" — "+fmt(total)+" ج.م"+(invPayType==="credit"?" 🕐 آجل":""));
      logActivity(currentUser?.name||"مدير","إصدار فاتورة","فاتورة "+no+" للعميل "+invC+" بإجمالي "+fmt(total)+" "+settings.currency+(invPayType==="credit"?" [آجل]":""));
      setInvC("");setInvN("");setInvD(0);setInvL([{pid:"",qty:""}]);setInvPayType("cash");setInvPaidAmt("");setModal(null);
      await load();
    }catch(e){toast("حدث خطأ","error");}
    setBusy(false);
  };

  const delInv=async(inv)=>{
    if(!confirm("حذف الفاتورة "+inv.invoiceNo+"؟"))return;
    setBusy(true);
    try{
      if(!inv.is_return){
        // ✅ إصلاح #3: نجيب المخزون الحالي من قاعدة البيانات مباشرة قبل الإضافة
        for(const l of (inv.lines||[])){
          const [fresh]=await db("products?id=eq."+l.productId+"&select=stock");
          if(fresh) await db("products?id=eq."+l.productId,{method:"PATCH",body:JSON.stringify({stock:fresh.stock+Number(l.qty)})});
        }
      }
      await db("invoice_lines?invoice_id=eq."+inv.id,{method:"DELETE",prefer:"return=minimal"});
      // حذف الدفعات المرتبطة بالفاتورة الآجلة (إن وجدت)
      if(!inv.is_return&&(inv.notes||"").includes("[آجل]")){
        await db("credit_payments?invoice_no=eq."+inv.invoiceNo,{method:"DELETE",prefer:"return=minimal"}).catch(()=>{});
      }
      await db("invoices?id=eq."+inv.id,{method:"DELETE",prefer:"return=minimal"});
      toast("تم حذف الفاتورة ✓");logActivity(currentUser?.name||"مدير","حذف فاتورة",inv.invoiceNo);setModal(null);setMd(null);await load();
    }catch(e){toast("حدث خطأ","error");}
    setBusy(false);
  };

  // return invoice
  const [retLines,setRetLines]=useState([]);
  const startReturn=inv=>{setRetLines((inv.lines||[]).map(l=>({...l,rqty:"0",on:false})));setMd(inv);setModal("ret");};
  const confirmRet=async()=>{
    const to=retLines.filter(l=>l.on&&+l.rqty>0);
    if(!to.length){toast("حدد صنفاً واحداً على الأقل","error");return;}
    // ✅ إصلاح #2: التحقق من أن كمية الإرجاع لا تتجاوز الكمية المباعة
    for(const l of to){
      if(+l.rqty>Number(l.qty)){
        toast("كمية الإرجاع ("+l.rqty+") تتجاوز الكمية المباعة ("+l.qty+") — "+l.productName,"error");
        return;
      }
    }
    setBusy(true);
    try{
      const total=to.reduce((a,l)=>a+Number(l.price)*+l.rqty,0);
      // ✅ إصلاح #1 للمرتجعات: نفس منطق الترقيم الآمن
      const allRets=await db("invoices?select=invoice_no&is_return=eq.true&order=id.desc&limit=1");
      let nextRet=1;
      if(allRets.length>0){const m=(allRets[0].invoice_no||"").match(/(\d+)$/);if(m)nextRet=parseInt(m[1],10)+1;}
      const no="RET-"+String(nextRet).padStart(4,"0");
      const [ni]=await db("invoices",{method:"POST",body:JSON.stringify({invoice_no:no,customer:md.customer,total,discount:0,notes:"مرتجع من "+md.invoiceNo,date:today(),is_return:true})});
      await db("invoice_lines",{method:"POST",body:JSON.stringify(to.map(l=>({invoice_id:ni.id,product_id:l.productId,product_name:l.productName,qty:+l.rqty,price:l.price,subtotal:Number(l.price)*+l.rqty,note:"مرتجع"})))});
      // ✅ إصلاح #3: نجيب المخزون الحالي من قاعدة البيانات مباشرة
      for(const l of to){
        const [fresh]=await db("products?id=eq."+l.productId+"&select=stock");
        if(fresh) await db("products?id=eq."+l.productId,{method:"PATCH",body:JSON.stringify({stock:fresh.stock+(+l.rqty)})});
      }
      toast("✓ مرتجع — "+fmt(total)+" ج.م");logActivity(currentUser?.name||"مدير","مرتجع","مرتجع من "+md.invoiceNo+" بإجمالي "+fmt(total));setModal(null);await load();
    }catch(e){toast("حدث خطأ","error");}
    setBusy(false);
  };

  const savePur=async()=>{
    if(!purF.pid||!purF.qty||purF.cost===""){toast("يرجى ملء الحقول المطلوبة","error");return;}
    setBusy(true);
    try{
      const prod=products.find(p=>p.id===+purF.pid);
      await db("purchases",{method:"POST",body:JSON.stringify({product_id:+purF.pid,product_name:prod.name,qty:+purF.qty,cost_price:+purF.cost,supplier_id:purF.sid?+purF.sid:null,notes:purF.notes,date:today(),total:+purF.qty*+purF.cost})});
      // ✅ إصلاح #2: نجيب المخزون الحالي من قاعدة البيانات مباشرة قبل التحديث لتجنب فقد تحديثات متزامنة

      if(can("editPrice")&&purF.price!==""&&!isNaN(+purF.price)) updateBody.price=+purF.price;
      await db("products?id=eq."+prod.id,{method:"PATCH",body:JSON.stringify(updateBody)});
      toast("✓ تم استلام "+purF.qty+" "+prod.unit+" من "+prod.name+(updateBody.price!==undefined?" — تم تحديث سعر البيع":""));
      logActivity(currentUser?.name||"مدير","استلام مشتريات",purF.qty+" "+prod.unit+" من "+prod.name+(updateBody.price!==undefined?" (سعر بيع جديد: "+fmt(updateBody.price)+")":""));
      setPurF({pid:"",qty:"",cost:"",price:"",sid:"",notes:""});setModal(null);await load();
    }catch(e){toast("حدث خطأ","error");}
    setBusy(false);
  };

    setBusy(true);
    try{
      if(modal==="editC"&&md) await db("customers?id=eq."+md.id,{method:"PATCH",body:JSON.stringify(cf)});

      toast("تم الحفظ ✓");logActivity(currentUser?.name||"مدير",modal==="editC"?"تعديل عميل":"إضافة عميل",cf.name);setCf({name:"",phone:"",notes:""});setModal(null);await load();
    }catch(e){toast("تأكد من وجود جدول customers","error");}
    setBusy(false);
  };

    try{

  const saveSupp=async()=>{
    if(!sf.name.trim()){toast("يرجى إدخال الاسم","error");return;}
    setBusy(true);
    try{
      if(modal==="editS"&&md) await db("suppliers?id=eq."+md.id,{method:"PATCH",body:JSON.stringify(sf)});
      else await db("suppliers",{method:"POST",body:JSON.stringify(sf)});
      toast("تم الحفظ ✓");logActivity(currentUser?.name||"مدير",modal==="editS"?"تعديل مورد":"إضافة مورد",sf.name);setSf({name:"",phone:"",notes:""});setModal(null);await load();
    }catch(e){toast("تأكد من وجود جدول suppliers","error");}
    setBusy(false);
  };

  // ── Customer credit stats ──
  const custCreditStats=useMemo(()=>customers.map(c=>{
    const ci=sales.filter(i=>i.customer===c.name);
    const totalInvoiced=ci.reduce((a,i)=>a+Number(i.total),0);
    // فواتير نقدي (بدون [آجل])
    const cashInvoiced=ci.filter(i=>!(i.notes||"").includes("[آجل]")).reduce((a,i)=>a+Number(i.total),0);
    // فواتير آجل
    const creditInvoiced=ci.filter(i=>(i.notes||"").includes("[آجل]")).reduce((a,i)=>a+Number(i.total),0);
    // مرتجعات العميل — نحسب فقط المرتجعات المرتبطة بفواتير آجل لأثرها على الدين
    const allRetsC=returns.filter(i=>i.customer===c.name);
    const totalRetsC=allRetsC.reduce((a,i)=>a+Number(i.total),0);
    // المرتجعات الآجلة: نرتبط كل مرتجع بفاتورته الأصلية عبر ملاحظة "مرتجع من INV-XXXX"
    const creditRetC=allRetsC.reduce((a,ret)=>{
      const srcNo=(ret.notes||"").replace("مرتجع من ","").trim();
      const srcInv=ci.find(inv=>inv.invoiceNo===srcNo);
      // إذا كانت الفاتورة الأصلية آجل، نحسب هذا المرتجع على الدين
      if(srcInv&&(srcInv.notes||"").includes("[آجل]")) return a+Number(ret.total);
      // إذا لم نعرف أصلها، نحتسبها كآجل احتياطاً
      if(!srcInv) return a+Number(ret.total);
      return a;
    },0);
    // دفعات مسجلة (دفعات آجل + دفعات مستقلة)
    const totalCreditPaid=creditPayments.filter(p=>p.customer_name===c.name).reduce((a,p)=>a+Number(p.amount),0);
    // المتبقي = آجل - مرتجعات آجل - دفعات مسجلة
    const remaining=Math.max(0,creditInvoiced-creditRetC-totalCreditPaid);
    return{...c,totalInvoiced,cashInvoiced,creditInvoiced,totalRetsC,totalCreditPaid,remaining,count:ci.length};
  }).sort((a,b)=>b.totalInvoiced-a.totalInvoiced),[customers,sales,returns,creditPayments]);

  // ── Backup: restore from JSON ──
  const importBackup=async(file)=>{
    if(!file)return;
    if(!confirm("⚠️ سيتم حذف جميع البيانات الحالية (منتجات، فواتير، عملاء، موردين، مشتريات) واستبدالها بمحتوى الملف المختار.\nهذا الإجراء لا يمكن التراجع عنه. هل أنت متأكد من الاستمرار؟"))return;
    setBusy(true);
    try{
      // ① تحقق من صحة الملف أولاً قبل أي حذف
      let data;
      try{data=JSON.parse(await file.text());}
      catch(e){toast("الملف تالف أو ليس JSON صالح","error");setBusy(false);return;}
      if(!Array.isArray(data.products)||!Array.isArray(data.invoices)){
        toast("ملف غير صالح — لا يحتوي على products أو invoices","error");setBusy(false);return;
      }
      if(data.products.length===0&&data.invoices.length===0){
        toast("الملف فارغ، لم يتم استيراد أي شيء","error");setBusy(false);return;
      }

      // ② حذف البيانات القديمة (بترتيب يحترم الروابط)
      await db("invoice_lines?id=gt.0",{method:"DELETE",prefer:"return=minimal"});
      await db("purchases?id=gt.0",{method:"DELETE",prefer:"return=minimal"}).catch(()=>{});
      await db("invoices?id=gt.0",{method:"DELETE",prefer:"return=minimal"});
      await db("products?id=gt.0",{method:"DELETE",prefer:"return=minimal"});
      await db("customers?id=gt.0",{method:"DELETE",prefer:"return=minimal"}).catch(()=>{});
      await db("suppliers?id=gt.0",{method:"DELETE",prefer:"return=minimal"}).catch(()=>{});
      await db("credit_payments?id=gt.0",{method:"DELETE",prefer:"return=minimal"}).catch(()=>{});

      // ③ استيراد البيانات الجديدة مع عرض التقدم
      const errs=[];

      // العملاء
      if(data.customers?.length) await db("customers",{method:"POST",body:JSON.stringify(data.customers.map(c=>pick(c,["name","phone","notes"])))}).catch(e=>errs.push("عملاء: "+e.message));

      // الموردون
      const suppMap={};
      for(const s of (data.suppliers||[])){
        try{const [ns]=await db("suppliers",{method:"POST",body:JSON.stringify(pick(s,["name","phone","notes"]))});if(ns)suppMap[s.id]=ns.id;}
        catch(e){errs.push("مورد «"+s.name+"»: "+e.message);}
      }

      // المنتجات
      const prodMap={};
      for(const p of data.products){
        try{const [np]=await db("products",{method:"POST",body:JSON.stringify({name:p.name,sku:p.sku,category:p.category||"",price:p.price||0,cost:p.cost||0,stock:p.stock||0,min_stock:p.min_stock||5,unit:p.unit||"قطعة",expiry:p.expiry||null,notes:p.notes||""})});prodMap[p.id]=np.id;}
        catch(e){errs.push("منتج «"+p.name+"»: "+e.message);}
      }

      // المشتريات
      for(const pu of (data.purchases||[])){
        await db("purchases",{method:"POST",body:JSON.stringify({product_id:prodMap[pu.product_id]||null,product_name:pu.product_name,qty:pu.qty,cost_price:pu.cost_price,supplier_id:pu.supplier_id?(suppMap[pu.supplier_id]||null):null,notes:pu.notes||"",date:pu.date,total:pu.total})}).catch(e=>errs.push("مشترى: "+e.message));
      }

      // الفواتير وبنودها
      for(const inv of data.invoices){
        try{
          const [ni]=await db("invoices",{method:"POST",body:JSON.stringify({invoice_no:inv.invoice_no,customer:inv.customer,total:inv.total,discount:inv.discount||0,notes:inv.notes||"",date:inv.date,is_return:inv.is_return||false})});
          const lines=(inv.lines||[]).map(l=>({invoice_id:ni.id,product_id:prodMap[l.product_id]||null,product_name:l.product_name,qty:l.qty,price:l.price,subtotal:l.subtotal,note:l.note||""}));
          if(lines.length) await db("invoice_lines",{method:"POST",body:JSON.stringify(lines)});
        }catch(e){errs.push("فاتورة «"+inv.invoice_no+"»: "+e.message);}
      }

      // دفعات الآجل
      for(const cp of (data.creditPayments||[])){
        await db("credit_payments",{method:"POST",body:JSON.stringify({customer_name:cp.customer_name,amount:cp.amount,notes:cp.notes||"",date:cp.date,invoice_no:cp.invoice_no||""})}).catch(e=>errs.push("دفعة: "+e.message));
      }

      if(errs.length>0){
        toast("⚠️ تمت الاستعادة مع "+errs.length+" خطأ","warning");
        console.warn("Import errors:",errs);
      }else{
        toast("✓ تمت الاستعادة الكاملة بنجاح");
      }
      logActivity(currentUser?.name||"مدير","استعادة نسخة احتياطية","منتجات:"+data.products.length+" فواتير:"+data.invoices.length+" دفعات:"+((data.creditPayments||[]).length));
      setModal(null);await load();
    }catch(e){toast("فشلت الاستعادة: "+e.message,"error");}
    setBusy(false);
  };

                    </button>
                  </div>
                )}

            {/* ── شجرة الحسابات ── */}

                </div>
                {Object.entries(ACCT_TYPES).map(([type,info])=>{
                  const typeAccts=accounts.filter(a=>a.type===type).sort((a,b)=>a.code.localeCompare(b.code));

                  return(
                    <div key={type} className="card" style={{marginBottom:10,overflow:"hidden"}}>
                      <div style={{background:info.color+"22",borderBottom:"1px solid "+info.color+"33",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                        <div style={{fontSize:11,color:info.color+"99"}}>{typeAccts.length} حساب</div>
                      </div>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{background:T.hdr}}>
                          {["الكود","اسم الحساب","الحساب الرئيسي","الرصيد",""].map(h=><th key={h} style={{padding:"8px 12px",textAlign:"right",fontWeight:700,color:T.sub}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                          {typeAccts.map(a=>{
                            const b=accountBalances[a.id]||{debit:0,credit:0};

                            const parent=accounts.find(x=>x.code===a.parentCode);
                            return(
                              <tr key={a.id} style={{borderBottom:"1px solid "+T.border}}>
                                <td style={{padding:"8px 12px",fontFamily:"monospace",color:info.color,fontWeight:700}}>{a.code}</td>
                                <td style={{padding:"8px 12px",fontWeight:600,color:T.text,paddingRight:parent?24:12}}>{parent?"└ ":""}{a.name}</td>
                                <td style={{padding:"8px 12px",color:T.sub,fontSize:11}}>{parent?parent.code+" "+parent.name:"—"}</td>
                                <td style={{padding:"8px 12px",fontWeight:700,color:bal>0?"#10B981":bal<0?"#EF4444":T.dim}}>{bal!==0?fmt(Math.abs(bal))+" ج.م":"—"}</td>

                                  <div style={{display:"flex",gap:4}}>

            {/* ── قيود اليومية ── */}

                {journals.length===0?<div className="card" style={{padding:40,textAlign:"center",color:T.dim}}>لا توجد قيود بعد</div>:(

                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead><tr style={{background:T.hdr}}>
                        {["التاريخ","الوصف","المبلغ","النوع","إجراءات"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"right",fontWeight:700,color:T.sub,borderBottom:"1px solid "+T.border}}>{h}</th>)}

                            <tr key={j.id} style={{borderBottom:"1px solid "+T.border,cursor:"pointer"}}

                              <td style={{padding:"9px 12px",fontWeight:600,color:T.text}}>{j.description}</td>
                              <td style={{padding:"9px 12px",fontWeight:800,color:"#3B82F6"}}>{fmt(j.total)} ج.م</td>
                              <td style={{padding:"9px 12px"}}>
                                <span style={{background:j.is_auto?"#3B82F622":"#10B98122",color:j.is_auto?"#3B82F6":"#10B981",borderRadius:5,padding:"2px 8px",fontSize:11,fontWeight:700}}>

                                </span>
                              </td>
                              <td style={{padding:"9px 12px"}} onClick={e=>e.stopPropagation()}>

                                  <button title="طباعة القيد" onClick={e=>{e.stopPropagation();printJournal(j,jLines);}} style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:6,color:"#3B82F6",padding:"3px 7px",cursor:"pointer",fontSize:11}}>🖨️</button>
                                  <button title="تصدير Excel" onClick={e=>{e.stopPropagation();exportJournalCSV(j,jLines);}} style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:6,color:"#10B981",padding:"3px 7px",cursor:"pointer",fontSize:11}}>📥</button>
                                  {!j.is_auto&&<button title="تعديل القيد" onClick={e=>{e.stopPropagation();openEditJournal(j,jLines);}} style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:6,color:"#F59E0B",padding:"3px 7px",cursor:"pointer",fontSize:11}}>✏️</button>}
                                  {!j.is_auto&&<button title="حذف القيد" onClick={e=>{e.stopPropagation();delJournal(j);}} style={{background:"#1A0000",border:"1px solid #EF444433",borderRadius:6,color:"#EF4444",padding:"3px 8px",cursor:"pointer",fontSize:11}}>🗑️</button>}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* ── ميزان المراجعة ── */}

                  const rows=trialBalance.filter(a=>a.totalDebit>0||a.totalCredit>0);

                      </div>
                      {rows.length===0?<div className="card" style={{padding:40,textAlign:"center",color:T.dim}}>لا توجد قيود بعد — أضف قيوداً يدوية أولاً</div>:(
                        <div className="card" style={{overflow:"hidden"}}>
                          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                            <thead><tr style={{background:T.hdr}}>
                              {["كود","اسم الحساب","النوع","مجموع المدين","مجموع الدائن"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"right",fontWeight:700,color:T.sub,borderBottom:"1px solid "+T.border}}>{h}</th>)}

                            <tbody>

                                    <td style={{padding:"9px 12px",fontWeight:600,color:T.text}}>{a.name}</td>
                                    <td style={{padding:"9px 12px"}}><span style={{background:info.color+"22",color:info.color,borderRadius:5,padding:"2px 8px",fontSize:11}}>{info.label}</span></td>
                                    <td style={{padding:"9px 12px",fontWeight:700,color:"#10B981"}}>{a.totalDebit>0?fmt(a.totalDebit)+" ج.م":"—"}</td>
                                    <td style={{padding:"9px 12px",fontWeight:700,color:"#EF4444"}}>{a.totalCredit>0?fmt(a.totalCredit)+" ج.م":"—"}</td>
                                  </tr>
                                );
                              })}
                              <tr style={{background:T.hdr,fontWeight:800}}>
                                <td colSpan={3} style={{padding:"10px 12px",color:T.text}}>الإجمالي</td>
                                <td style={{padding:"10px 12px",color:"#10B981",fontWeight:800}}>{fmt(totalD)} ج.م</td>
                                <td style={{padding:"10px 12px",color:"#EF4444",fontWeight:800}}>{fmt(totalC)} ج.م</td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ── قائمة الدخل ── */}

              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>

                  <div style={{display:"flex",gap:8}}>
                    <button onClick={printIncomeStatement} className="btn" style={{background:"linear-gradient(135deg,#3B82F6,#1D4ED8)",color:"#fff",fontSize:12}}>🖨️ طباعة</button>
                    <button onClick={exportIncomeStatementCSV} className="btn" style={{background:"linear-gradient(135deg,#10B981,#059669)",color:"#fff",fontSize:12}}>📥 Excel</button>
                  </div>
                </div>
                <div className="card" style={{padding:20,maxWidth:600,margin:"0 auto"}}>
                  <div style={{fontSize:13,fontWeight:800,color:T.text,marginBottom:14,textAlign:"center",borderBottom:"2px solid "+T.border,paddingBottom:10}}>
                    {settings.storeName}<br/>
                    <span style={{fontSize:11,color:T.sub,fontWeight:400}}>قائمة الدخل — {new Date().toLocaleDateString("ar-EG")}</span>
                  </div>

                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:"#10B981",marginBottom:8,background:"#10B98111",padding:"6px 10px",borderRadius:8}}>📥 الإيرادات</div>
                    <div style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",fontSize:12}}>
                      <span style={{color:T.sub}}>إيرادات المبيعات (من الفواتير)</span>
                      <span style={{fontWeight:700,color:"#10B981"}}>{fmt(netRev)} ج.م</span>
                    </div>
                    {incomeStatement.revenues.filter(a=>a.netCredit>0).map(a=>{
                      const relatedJournals=journals.filter(j=>journalLines.some(l=>l.journal_id===j.id&&l.account_id===a.id));
                      return(
                        <div key={a.id} style={{padding:"6px 10px",fontSize:12,borderBottom:"1px dashed "+T.border}}>
                          <div style={{display:"flex",justifyContent:"space-between"}}>
                            <span style={{color:T.sub}}>{a.name} <span style={{fontSize:10,color:T.dim}}>({a.code})</span></span>
                            <span style={{fontWeight:700,color:"#10B981"}}>{fmt(a.netCredit)} ج.م</span>
                          </div>
                          {relatedJournals.length>0&&(
                            <div style={{marginTop:4,paddingRight:8,borderRight:"2px solid #10B98144"}}>
                              {relatedJournals.slice(0,3).map(j=>(
                                <div key={j.id} style={{display:"flex",justifyContent:"space-between",fontSize:10,color:T.dim,marginBottom:2}}>
                                  <span>📝 {j.description} ({j.date})</span>
                                  <span style={{color:"#10B98199"}}>{fmt(journalLines.filter(l=>l.journal_id===j.id&&l.account_id===a.id).reduce((s,l)=>s+(+l.credit||0),0))} ج.م</span>
                                </div>
                              ))}
                              {relatedJournals.length>3&&<div style={{fontSize:10,color:T.dim}}>+ {relatedJournals.length-3} قيود أخرى</div>}
                            </div>
                          )}
                        </div>
                      );

                    <div style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",fontSize:13,fontWeight:800,borderTop:"1px solid "+T.border,marginTop:4}}>
                      <span style={{color:T.text}}>إجمالي الإيرادات</span>
                      <span style={{color:"#10B981"}}>{fmt(netRev+incomeStatement.totalRevenue)} ج.م</span>
                    </div>
                  </div>

                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:"#EF4444",marginBottom:8,background:"#EF444411",padding:"6px 10px",borderRadius:8}}>📤 المصروفات</div>
                    <div style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",fontSize:12}}>
                      <span style={{color:T.sub}}>تكلفة البضاعة المباعة (مشتريات)</span>
                      <span style={{fontWeight:700,color:"#EF4444"}}>{fmt(incomeStatement.autoCOGS)} ج.م</span>
                    </div>
                    {incomeStatement.expenses.filter(a=>a.netDebit>0).map(a=>{
                      const relatedJournals=journals.filter(j=>journalLines.some(l=>l.journal_id===j.id&&l.account_id===a.id));

                          {relatedJournals.length>0&&(
                            <div style={{marginTop:4,paddingRight:8,borderRight:"2px solid #EF444444"}}>
                              {relatedJournals.slice(0,3).map(j=>(
                                <div key={j.id} style={{display:"flex",justifyContent:"space-between",fontSize:10,color:T.dim,marginBottom:2}}>
                                  <span>📝 {j.description} ({j.date})</span>
                                  <span style={{color:"#EF444499"}}>{fmt(journalLines.filter(l=>l.journal_id===j.id&&l.account_id===a.id).reduce((s,l)=>s+(+l.debit||0),0))} ج.م</span>
                                </div>
                              ))}
                              {relatedJournals.length>3&&<div style={{fontSize:10,color:T.dim}}>+ {relatedJournals.length-3} قيود أخرى</div>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    <div style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",fontSize:13,fontWeight:800,borderTop:"1px solid "+T.border,marginTop:4}}>
                      <span style={{color:T.text}}>إجمالي المصروفات</span>
                      <span style={{color:"#EF4444"}}>{fmt(incomeStatement.autoCOGS+incomeStatement.totalExpense)} ج.م</span>

                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0"}}>

                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0"}}>
                        <span style={{color:T.sub}}>الذمم المدينة (آجل)</span>
                        <span style={{fontWeight:700,color:"#3B82F6"}}>{fmt(custCreditStats.reduce((a,c)=>a+c.remaining,0))} ج.م</span>
                      </div>
                      {balanceSheet.assets.filter(a=>a.netDebit>0).map(a=>(
                        <div key={a.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0"}}>
                          <span style={{color:T.sub}}>{a.name}</span>
                          <span style={{fontWeight:700,color:"#3B82F6"}}>{fmt(a.netDebit)} ج.م</span>
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:800,borderTop:"2px solid #3B82F633",paddingTop:8}}>
                      <span style={{color:"#3B82F6"}}>إجمالي الأصول</span>
                      <span style={{color:"#3B82F6"}}>{fmt(Math.round(balanceSheet.totalAssets+custCreditStats.reduce((a,c)=>a+c.remaining,0)))} ج.م</span>
                    </div>
                  </div>

                  {/* الخصوم وحقوق الملكية */}

                    <div style={{fontSize:13,fontWeight:800,color:"#EF4444",marginBottom:12,borderBottom:"2px solid #EF444433",paddingBottom:8}}>📋 الخصوم وحقوق الملكية</div>
                    {balanceSheet.liabilities.filter(a=>a.netCredit>0).length>0&&(
                      <div style={{marginBottom:10}}>
                        <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>الخصوم</div>
                        {balanceSheet.liabilities.filter(a=>a.netCredit>0).map(a=>(
                          <div key={a.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0"}}>
                            <span style={{color:T.sub}}>{a.name}</span>
                            <span style={{fontWeight:700,color:"#EF4444"}}>{fmt(a.netCredit)} ج.م</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div style={{marginBottom:10}}>
                      <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>حقوق الملكية</div>
                      {balanceSheet.equity.filter(a=>a.netCredit>0).map(a=>(
                        <div key={a.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0"}}>
                          <span style={{color:T.sub}}>{a.name}</span>
                          <span style={{fontWeight:700,color:"#8B5CF6"}}>{fmt(a.netCredit)} ج.م</span>
