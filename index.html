                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0"}}>
                        <span style={{color:T.sub}}>الأرباح المحتجزة (صافي الربح)</span>
                        <span style={{fontWeight:700,color:"#10B981"}}>{fmt(Math.round(incomeStatement.netIncome))} ج.م</span>
                      </div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:800,borderTop:"2px solid #EF444433",paddingTop:8}}>
                      <span style={{color:"#EF4444"}}>إجمالي الخصوم + الملكية</span>
                      <span style={{color:"#EF4444"}}>{fmt(Math.round(balanceSheet.totalLiabilities+balanceSheet.totalEquity))} ج.م</span>
                    </div>
                  </div>
                </div>

                <div style={{marginTop:14,padding:"12px 16px",borderRadius:10,background:Math.abs((balanceSheet.totalAssets+custCreditStats.reduce((a,c)=>a+c.remaining,0))-(balanceSheet.totalLiabilities+balanceSheet.totalEquity))<100?"#0A1F0A":"#1A0000",border:"1px solid "+(Math.abs((balanceSheet.totalAssets+custCreditStats.reduce((a,c)=>a+c.remaining,0))-(balanceSheet.totalLiabilities+balanceSheet.totalEquity))<100?"#10B98133":"#EF444433"),textAlign:"center",fontSize:13,fontWeight:800,color:Math.abs((balanceSheet.totalAssets+custCreditStats.reduce((a,c)=>a+c.remaining,0))-(balanceSheet.totalLiabilities+balanceSheet.totalEquity))<100?"#10B981":"#EF4444"}}>
                  {Math.abs((balanceSheet.totalAssets+custCreditStats.reduce((a,c)=>a+c.remaining,0))-(balanceSheet.totalLiabilities+balanceSheet.totalEquity))<100
                    ?"✓ الميزانية متوازنة — الأصول = الخصوم + حقوق الملكية"
                    :"⚠️ ملاحظة: تحتاج إضافة قيود لرأس المال والخصوم لإتمام الميزانية"}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ACTIVITY LOG */}
        {tab==="log"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontSize:15,fontWeight:800,color:"#E2E8F0"}}>📋 سجل العمليات</div>
              <button onClick={load} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:"#6B8AAF",fontSize:12,padding:"6px 12px"}}>🔄 تحديث</button>
            </div>
            {isManager&&<div className="card" style={{padding:"12px 14px",marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:800,color:"#7A8EAE",marginBottom:8}}>🗑️ حذف فترات من السجل</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontSize:11,color:"#4A5E7A",marginBottom:3}}>من تاريخ</div>
                  <input type="date" value={logFrom} onChange={e=>setLogFrom(e.target.value)} style={{width:"100%",padding:"7px 9px",borderRadius:8,border:"1.5px solid #1E2D45",background:"#0B1120",color:"#E2E8F0",fontSize:12,direction:"ltr"}}/>
                </div>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontSize:11,color:"#4A5E7A",marginBottom:3}}>إلى تاريخ</div>
                  <input type="date" value={logTo} onChange={e=>setLogTo(e.target.value)} style={{width:"100%",padding:"7px 9px",borderRadius:8,border:"1.5px solid #1E2D45",background:"#0B1120",color:"#E2E8F0",fontSize:12,direction:"ltr"}}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {(logFrom||logTo)&&<button onClick={()=>{setLogFrom("");setLogTo("");}} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:"#6B8AAF",fontSize:12,padding:"7px 11px"}}>مسح</button>}
                  <button onClick={delActLog} disabled={busy} className="btn" style={{background:busy?"#1A2640":"linear-gradient(135deg,#EF4444,#B91C1C)",color:"#fff",fontSize:12,padding:"7px 14px"}}>
                    {logFrom||logTo?"🗑️ حذف الفترة المحددة":"🗑️ حذف كل السجل"}
                  </button>
                </div>
              </div>
              <div style={{fontSize:10,color:"#3A5070",marginTop:6}}>اتركهما فارغين لحذف كل السجل دفعة واحدة.</div>
            </div>}
            <div className="card" style={{overflow:"hidden"}}>
              {actLog.length===0?<div style={{padding:"40px",textAlign:"center",color:"#3A5070",fontSize:13}}>لا توجد عمليات بعد</div>:(
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead><tr style={{background:"#1A2640"}}>
                      {["الدور","العملية","التفاصيل","الوقت"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"right",fontWeight:700,color:"#4A5E7A",borderBottom:"1px solid #1E2D45",whiteSpace:"nowrap"}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {actLog.map((l,i)=>{
                        // user_role الآن هو اسم اليوزر
                        const uname=l.user_role||"؟";
                        const isM=uname==="مدير"||uname==="manager";
                        const badgeColor=isM?"#F59E0B":"#3B82F6";
                        return(
                          <tr key={l.id||i} style={{borderBottom:"1px solid #18253A"}}>
                            <td style={{padding:"9px 12px"}}>
                              <span style={{background:badgeColor+"22",color:badgeColor,borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:700}}>👤 {uname}</span>
                            </td>
                            <td style={{padding:"9px 12px",fontWeight:700,color:"#E2E8F0"}}>{l.action}</td>
                            <td style={{padding:"9px 12px",color:"#6B8AAF",maxWidth:220}}><div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.details||"—"}</div></td>
                            <td style={{padding:"9px 12px",color:"#4A5E7A",whiteSpace:"nowrap"}}>{new Date(l.created_at).toLocaleString("ar-EG",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      {/* ════ MODALS ════ */}

      {/* ADD/EDIT PRODUCT */}
      {(modal==="addP"||modal==="editP")&&(
        <Modal title={modal==="editP"?"تعديل المنتج":"إضافة منتج"} onClose={()=>{setModal(null);setMd(null);}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
            <div style={{gridColumn:"1/-1"}}><F label="اسم المنتج *" value={pf.name} onChange={e=>setPf(p=>({...p,name:e.target.value}))} placeholder="اسم المنتج"/></div>
            <F label="رمز SKU *" value={pf.sku} onChange={e=>setPf(p=>({...p,sku:e.target.value}))} placeholder="PROD-001"/>
            <F label="الفئة" value={pf.category} onChange={e=>setPf(p=>({...p,category:e.target.value}))} placeholder="إلكترونيات"/>
            <F label="سعر البيع *" type="number" value={pf.price} disabled={!can("editPrice")} onChange={e=>setPf(p=>({...p,price:e.target.value}))} hint={pf.price&&+pf.price>0&&pf.cost?"هامش "+Math.round(((+pf.price-+pf.cost)/+pf.price)*100)+"%":""} placeholder="0"/>
            <F label="سعر التكلفة" type="number" value={pf.cost} disabled={!can("editPrice")} onChange={e=>setPf(p=>({...p,cost:e.target.value}))} placeholder="0"/>
            <F label="الكمية *" type="number" value={pf.stock} onChange={e=>setPf(p=>({...p,stock:e.target.value}))} placeholder="0"/>
            <F label="حد التنبيه" type="number" value={pf.minStock} onChange={e=>setPf(p=>({...p,minStock:e.target.value}))} placeholder="5"/>
            <F label="الوحدة" value={pf.unit} onChange={e=>setPf(p=>({...p,unit:e.target.value}))} placeholder="قطعة"/>
            <div style={{gridColumn:"1/-1"}}><F label="تاريخ الانتهاء" type="date" value={pf.expiry} onChange={e=>setPf(p=>({...p,expiry:e.target.value}))}/></div>
            <div style={{gridColumn:"1/-1"}}><TA label="ملاحظات" value={pf.notes} onChange={e=>setPf(p=>({...p,notes:e.target.value}))} placeholder="اختياري..."/></div>
          </div>
          <button onClick={saveProd} disabled={busy} className="btn" style={{width:"100%",padding:"12px",background:busy?"#1A2640":"linear-gradient(135deg,#10B981,#059669)",color:"#fff",fontSize:15,borderRadius:12}}>
            {busy?"⏳ جاري الحفظ...":modal==="editP"?"💾 حفظ التعديلات":"✓ إضافة المنتج"}
          </button>
        </Modal>
      )}

      {/* VIEW PRODUCT */}
      {modal==="vP"&&md&&(
        <Modal title={md.name} sub={md.sku+(md.category?" · "+md.category:"")} onClose={()=>{setModal(null);setMd(null);}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {[{l:"سعر البيع",v:fmt(md.price)+" ج.م",c:"#3B82F6"},...(can("viewCost")?[{l:"التكلفة",v:fmt(md.cost)+" ج.م",c:"#6B8AAF"},{l:"هامش الربح",v:(md.price>0?Math.round((md.price-md.cost)/md.price*100):0)+"%",c:"#10B981"}]:[]),{l:"المخزون",v:md.stock+" "+(md.unit||"قطعة"),c:sc(md.stock,md.minStock)}].map(s=>(
              <div key={s.l} style={{background:"#0B1120",borderRadius:9,padding:"11px",textAlign:"center"}}>
                <div style={{fontSize:10,color:"#4A5E7A",marginBottom:3}}>{s.l}</div>
                <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
              </div>
            ))}
          </div>
          {prodPerf.find(x=>x.id===md.id)&&prodPerf.find(x=>x.id===md.id).rev>0&&(
            <div style={{background:"#0B1F2E",border:"1px solid #1E2D45",borderRadius:10,padding:"12px",marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#6B8AAF",marginBottom:7}}>أداء المبيعات</div>
              <div style={{display:"flex",justifyContent:"space-around"}}>
                {[{l:"الإيرادات",v:fmt(prodPerf.find(x=>x.id===md.id).rev)+" ج.م",c:"#3B82F6"},...(can("viewCost")?[{l:"الربح",v:fmt(prodPerf.find(x=>x.id===md.id).profit)+" ج.م",c:"#10B981"}]:[]),{l:"الكمية",v:prodPerf.find(x=>x.id===md.id).qty,c:"#F59E0B"}].map(s=>(
                  <div key={s.l} style={{textAlign:"center"}}><div style={{fontSize:14,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:10,color:"#4A5E7A"}}>{s.l}</div></div>
                ))}
              </div>
            </div>
          )}
          {md.expiry&&<div style={{background:"#1A0E00",border:"1px solid #F59E0B44",borderRadius:8,padding:"9px 12px",marginBottom:10,fontSize:12,color:"#F59E0B"}}>⏰ تاريخ الانتهاء: {md.expiry}</div>}
          {md.notes&&<div style={{background:"#1A2640",borderRadius:8,padding:"9px 12px",marginBottom:10,fontSize:12,color:"#6B8AAF"}}>{md.notes}</div>}
          {(can("editProduct")||can("deleteProduct"))&&<div style={{display:"flex",gap:8}}>
            {can("editProduct")&&<button onClick={()=>{setPf({name:md.name,sku:md.sku,category:md.category||"",price:md.price,cost:md.cost,stock:md.stock,minStock:md.min_stock||md.minStock,unit:md.unit||"قطعة",expiry:md.expiry||"",notes:md.notes||""});setModal("editP");}} className="btn" style={{flex:1,padding:"11px",background:"linear-gradient(135deg,#3B82F6,#1D4ED8)",color:"#fff"}}>✏️ تعديل</button>}
            {can("deleteProduct")&&<button onClick={()=>delProd(md.id)} className="btn" style={{padding:"11px 14px",background:"#1A0000",border:"1px solid #EF444433",color:"#EF4444"}}>🗑️</button>}
          </div>}
        </Modal>
      )}


      {/* NEW INVOICE */}
      {modal==="inv"&&(
        <Modal title="فاتورة بيع جديدة" onClose={()=>setModal(null)} wide>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
            <div style={{gridColumn:"1/-1"}}><F label="اسم العميل *" value={invC} onChange={e=>setInvC(e.target.value)} placeholder="اسم العميل"/></div>
            {can("applyDiscount")&&<F label="خصم %" type="number" value={invD} onChange={e=>setInvD(e.target.value)} placeholder="0"/>}
            <F label="ملاحظات" value={invN} onChange={e=>setInvN(e.target.value)} placeholder="اختياري"/>
          </div>
          {/* طريقة الدفع */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,color:"#7A8EAE",marginBottom:6}}>طريقة الدفع</div>
            <div style={{display:"flex",gap:8}}>
              {[{v:"cash",l:"💵 نقدي",c:"#10B981"},{v:"credit",l:"🕐 آجل",c:"#F59E0B"}].map(t=>(
                <button key={t.v} onClick={()=>setInvPayType(t.v)} className="btn" style={{flex:1,padding:"9px",background:invPayType===t.v?t.c+"22":"#0B1120",border:"1.5px solid "+(invPayType===t.v?t.c:"#1E2D45"),color:invPayType===t.v?t.c:"#6B8AAF",fontSize:13,fontWeight:700}}>{t.l}</button>
              ))}
            </div>
            {invPayType==="credit"&&(
              <div style={{marginTop:8,background:"#1A1000",border:"1px solid #F59E0B33",borderRadius:9,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:"#F59E0B",marginBottom:6}}>💡 الفاتورة ستُسجَّل كدين على العميل</div>
                <F label="دفعة مقدمة (اختياري)" type="number" value={invPaidAmt} onChange={e=>setInvPaidAmt(e.target.value)} placeholder="0 — اتركه فارغاً إذا لم يدفع الآن" hint={invPaidAmt&&invTot>0?"متبقي: "+fmt(Math.max(0,Math.round(invTot)-+invPaidAmt))+" ج.م":""}/>
              </div>
            )}
          </div>
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontSize:12,fontWeight:800,color:"#D0D8F0"}}>الأصناف *</div>
              <button onClick={()=>setInvL(p=>[...p,{pid:"",qty:""}])} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:"#3B82F6",fontSize:12,padding:"5px 11px"}}>+ صنف</button>
            </div>
            {invL.map((l,i)=>{
              const p=products.find(p=>p.id===+l.pid);
              const sub=p&&l.qty?Number(p.price)*+l.qty:0;
              return(
                <div key={i} style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:9,padding:"10px",marginBottom:7}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 85px 28px",gap:7,marginBottom:4}}>
                    <select value={l.pid} onChange={e=>setInvL(prev=>prev.map((x,idx)=>idx===i?{...x,pid:e.target.value}:x))}
                      style={{padding:"7px 9px",borderRadius:8,border:"1.5px solid #1E2D45",background:"#0B1120",color:"#E2E8F0",fontSize:12,direction:"rtl",width:"100%"}}>
                      <option value="">— اختر منتجاً —</option>
                      {products.filter(p=>p.stock>0).map(p=><option key={p.id} value={p.id}>{p.name} ({p.stock})</option>)}
                    </select>
                    <input type="number" min="1" value={l.qty} onChange={e=>setInvL(prev=>prev.map((x,idx)=>idx===i?{...x,qty:e.target.value}:x))} placeholder="الكمية"
                      style={{padding:"7px 9px",borderRadius:8,border:"1.5px solid #1E2D45",background:"#0B1120",color:"#E2E8F0",fontSize:12,direction:"rtl",width:"100%"}}/>
                    {invL.length>1?<button onClick={()=>setInvL(p=>p.filter((_,idx)=>idx!==i))} style={{background:"#1A0000",border:"1px solid #EF444433",borderRadius:7,color:"#EF4444",width:28,height:28,cursor:"pointer",fontSize:14}}>×</button>:<div/>}
                  </div>
                  {p&&<div style={{fontSize:11,color:"#4A5E7A",display:"flex",justifyContent:"space-between"}}>
                    <span>سعر: {fmt(p.price)} ج.م</span>
                    {sub>0&&<span style={{color:"#10B981",fontWeight:700}}>{fmt(sub)} ج.م</span>}
                  </div>}
                </div>
              );
            })}
          </div>
          {invSub>0&&(
            <div style={{background:"#0A1F0A",border:"1px solid #10B98133",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
              {(+invD>0||invTaxAmt>0)&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:"#6B8AAF"}}>المجموع</span><span>{fmt(invSub)} ج.م</span></div>}
              {+invD>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:"#F59E0B"}}>خصم {invD}%</span><span style={{color:"#F59E0B"}}>- {fmt(Math.round(invDiscAmt))} ج.م</span></div>}
              {invTaxAmt>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:"#7C3AED"}}>ضريبة {invTaxRate}%</span><span style={{color:"#7C3AED"}}>+ {fmt(Math.round(invTaxAmt))} ج.م</span></div>}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:13,fontWeight:700,color:"#6B8AAF"}}>الإجمالي</span>
                <span style={{fontSize:20,fontWeight:800,color:"#10B981"}}>{fmt(Math.round(invTot))} ج.م</span>
              </div>
            </div>
          )}
          <button onClick={saveInv} disabled={busy} className="btn" style={{width:"100%",padding:"12px",background:busy?"#1A2640":"linear-gradient(135deg,#F59E0B,#D97706)",color:"#fff",fontSize:15,borderRadius:12}}>
            {busy?"⏳ جاري الحفظ...":"🧾 تأكيد وإصدار الفاتورة"}
          </button>
        </Modal>
      )}

      {/* VIEW INVOICE */}
      {modal==="vI"&&md&&(
        <Modal title={"فاتورة "+md.invoiceNo} sub={md.customer+" · "+md.date} onClose={()=>{setModal(null);setMd(null);}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            {[{l:"الإجمالي",v:fmt(md.total)+" ج.م",c:md.is_return?"#EF4444":"#10B981"},{l:"الأصناف",v:(md.lines||[]).length+" صنف",c:"#3B82F6"},{l:"الخصم",v:md.discount>0?md.discount+"%":"—",c:"#F59E0B"}].map(s=>(
              <div key={s.l} style={{background:"#0B1120",borderRadius:8,padding:"10px",textAlign:"center"}}>
                <div style={{fontSize:10,color:"#4A5E7A",marginBottom:3}}>{s.l}</div>
                <div style={{fontSize:15,fontWeight:800,color:s.c}}>{s.v}</div>
              </div>
            ))}
          </div>
          <div style={{background:"#0B1120",borderRadius:10,overflow:"hidden",marginBottom:12}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{background:"#1A2640"}}>{["المنتج","الكمية","السعر","المجموع"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:"#4A5E7A"}}>{h}</th>)}</tr></thead>
              <tbody>{(md.lines||[]).map((l,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #18253A"}}>
                  <td style={{padding:"8px 10px",fontWeight:600,color:"#B0C0D8"}}>{l.productName}</td>
                  <td style={{padding:"8px 10px",color:"#6B8AAF"}}>{l.qty}</td>
                  <td style={{padding:"8px 10px",color:"#6B8AAF"}}>{fmt(l.price)} ج.م</td>
                  <td style={{padding:"8px 10px",fontWeight:700,color:"#10B981"}}>{fmt(l.subtotal)} ج.م</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
          {md.notes&&<div style={{background:"#1A2640",borderRadius:8,padding:"9px 12px",marginBottom:10,fontSize:12,color:"#6B8AAF"}}>📝 {md.notes}</div>}
          <div style={{background:"#0A1F0A",border:"1px solid #10B98133",borderRadius:10,padding:"12px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:700,color:"#6B8AAF"}}>الإجمالي</span>
            <span style={{fontSize:19,fontWeight:800,color:md.is_return?"#EF4444":"#10B981"}}>{fmt(md.total)} ج.م</span>
          </div>
          <div style={{display:"flex",gap:7}}>
            <button onClick={()=>printInv(md,settings)} className="btn" style={{flex:1,padding:"10px",background:"linear-gradient(135deg,#3B82F6,#1D4ED8)",color:"#fff",fontSize:13}}>🖨️ طباعة</button>
            <button onClick={()=>{const ph=customers.find(c=>c.name===md.customer)?.phone||"";const lines=(md.lines||[]).map(l=>"• "+l.productName+" × "+l.qty+" = "+fmt(l.subtotal)+" "+settings.currency).join("\n");const msg="🏪 *"+settings.storeName+"*\n\nفاتورة: "+md.invoiceNo+"\nالتاريخ: "+md.date+"\n\n"+lines+"\n\n💰 الإجمالي: "+fmt(md.total)+" "+settings.currency+"\n\n"+settings.footer;window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(msg),"_blank");}} className="btn" style={{flex:1,padding:"10px",background:"linear-gradient(135deg,#25D366,#128C7E)",color:"#fff",fontSize:13}}>📱 واتساب</button>
            {!md.is_return&&can("returnInvoice")&&<button onClick={()=>startReturn(md)} className="btn" style={{padding:"10px 13px",background:"#1A0000",border:"1px solid #EF444433",color:"#EF4444",fontSize:13}}>↩️</button>}
            {can("deleteInvoice")&&<button onClick={()=>delInv(md)} className="btn" style={{padding:"10px 13px",background:"#1A0000",border:"1px solid #EF444433",color:"#EF4444",fontSize:13}}>🗑️</button>}
          </div>
        </Modal>
      )}

      {/* RETURN */}
      {modal==="ret"&&md&&(
        <Modal title="مرتجع فاتورة" sub={"من "+md.invoiceNo+" — "+md.customer} onClose={()=>setModal(null)}>
          {retLines.map((l,i)=>(
            <div key={i} style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:9,padding:"10px",marginBottom:7}}>
              <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:6}}>
                <input type="checkbox" checked={l.on} onChange={e=>setRetLines(prev=>prev.map((x,idx)=>idx===i?{...x,on:e.target.checked}:x))} style={{width:15,height:15,cursor:"pointer"}}/>
                <span style={{fontSize:13,fontWeight:600,color:"#B0C0D8",flex:1}}>{l.productName}</span>
                <span style={{fontSize:11,color:"#4A5E7A"}}>تم بيع: {l.qty}</span>
              </div>
              {l.on&&<div style={{display:"flex",alignItems:"center",gap:8,paddingRight:24}}>
                <label style={{fontSize:11,color:"#6B8AAF"}}>كمية الإرجاع:</label>
                <input type="number" min="1" max={l.qty} value={l.rqty}
                  onChange={e=>{
                    const v=Math.min(+e.target.value,Number(l.qty));
                    setRetLines(prev=>prev.map((x,idx)=>idx===i?{...x,rqty:String(v)}:x));
                  }}
                  style={{width:70,padding:"5px 8px",borderRadius:7,border:"1.5px solid "+(+l.rqty>Number(l.qty)?"#EF4444":"#1E2D45"),background:"#0B1120",color:"#E2E8F0",fontSize:12,direction:"rtl"}}/>
                {+l.rqty>0&&<span style={{fontSize:11,color:"#10B981",fontWeight:700}}>{fmt(Number(l.price)*+l.rqty)} ج.م</span>}
                <span style={{fontSize:10,color:"#3A5070"}}>/ {l.qty} أقصى</span>
              </div>}
            </div>
          ))}
          <div style={{background:"#1A0000",border:"1px solid #EF444433",borderRadius:10,padding:"11px 14px",marginBottom:12,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:12,color:"#6B8AAF"}}>إجمالي المرتجع</span>
            <span style={{fontSize:15,fontWeight:800,color:"#EF4444"}}>{fmt(retLines.filter(l=>l.on&&l.rqty).reduce((a,l)=>a+Number(l.price)*+l.rqty,0))} ج.م</span>
          </div>
          <button onClick={confirmRet} disabled={busy} className="btn" style={{width:"100%",padding:"12px",background:busy?"#1A2640":"linear-gradient(135deg,#EF4444,#B91C1C)",color:"#fff",fontSize:14,borderRadius:12}}>
            {busy?"⏳ جاري المعالجة...":"↩️ تأكيد الإرجاع"}
          </button>
        </Modal>
      )}

      {/* PURCHASE */}
      {modal==="pur"&&(
        <Modal title="إضافة مشتريات" sub="تحديث المخزون" onClose={()=>setModal(null)}>
          <SF label="المنتج *" value={purF.pid} onChange={e=>{
            const pid=e.target.value;
            const prod=products.find(x=>x.id===+pid);
            setPurF(p=>({...p,pid,cost:prod?String(prod.cost):p.cost,price:prod&&can("editPrice")?String(prod.price):p.price}));
          }}>
            <option value="">— اختر منتجاً —</option>
            {products.map(p=><option key={p.id} value={p.id}>{p.name} (مخزون: {p.stock})</option>)}
          </SF>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
            <F label="الكمية *" type="number" value={purF.qty} onChange={e=>setPurF(p=>({...p,qty:e.target.value}))} placeholder="0"/>
            <F label="سعر التكلفة *" type="number" value={purF.cost} onChange={e=>setPurF(p=>({...p,cost:e.target.value}))} hint={purF.qty&&purF.cost?"إجمالي: "+fmt(purF.qty*purF.cost):""} placeholder="0"/>
          </div>
          {can("editPrice")&&
            <F label="سعر البيع الجديد (اختياري)" type="number" value={purF.price} onChange={e=>setPurF(p=>({...p,price:e.target.value}))}
              hint={purF.price&&+purF.price>0&&+purF.cost>=0?"هامش الربح "+Math.round(((+purF.price-+purF.cost)/+purF.price)*100)+"%":"اتركه فارغاً أو بدون تغيير للإبقاء على سعر البيع الحالي"}
              placeholder="اتركه كما هو"/>}
          <SF label="المورد" value={purF.sid} onChange={e=>setPurF(p=>({...p,sid:e.target.value}))}>
            <option value="">— بدون مورد —</option>
            {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </SF>
          <TA label="ملاحظات" value={purF.notes} onChange={e=>setPurF(p=>({...p,notes:e.target.value}))} placeholder="اختياري..."/>
          <button onClick={savePur} disabled={busy} className="btn" style={{width:"100%",padding:"12px",background:busy?"#1A2640":"linear-gradient(135deg,#8B5CF6,#6D28D9)",color:"#fff",fontSize:15,borderRadius:12}}>
            {busy?"⏳ جاري الحفظ...":"📥 تأكيد الاستلام"}
          </button>
        </Modal>
      )}

      {/* ADD/EDIT CUSTOMER */}
      {(modal==="addC"||modal==="editC")&&(
        <Modal title={modal==="editC"?"تعديل عميل":"إضافة عميل"} onClose={()=>setModal(null)}>
          <F label="الاسم *" value={cf.name} onChange={e=>setCf(p=>({...p,name:e.target.value}))} placeholder="اسم العميل"/>
          <F label="الهاتف" value={cf.phone} onChange={e=>setCf(p=>({...p,phone:e.target.value}))} placeholder="01xxxxxxxxx"/>
          <TA label="ملاحظات" value={cf.notes} onChange={e=>setCf(p=>({...p,notes:e.target.value}))} placeholder="اختياري..."/>
          <button onClick={saveCust} disabled={busy} className="btn" style={{width:"100%",padding:"12px",background:busy?"#1A2640":"linear-gradient(135deg,#3B82F6,#1D4ED8)",color:"#fff",fontSize:14,borderRadius:12}}>
            {busy?"⏳ جاري الحفظ...":"✓ حفظ"}
          </button>
        </Modal>
      )}

      {/* VIEW CUSTOMER - كشف حساب مفصل */}
      {modal==="vC"&&md&&(()=>{
        const cst=custCreditStats.find(c=>c.id===md.id)||md;
        const custInvs=sales.filter(inv=>inv.customer===cst.name&&(!stmtFrom||inv.date>=stmtFrom)&&(!stmtTo||inv.date<=stmtTo));
        const custRets=returns.filter(inv=>inv.customer===cst.name&&(!stmtFrom||inv.date>=stmtFrom)&&(!stmtTo||inv.date<=stmtTo));
        const custPays=creditPayments.filter(p=>p.customer_name===cst.name&&(!stmtFrom||p.date>=stmtFrom)&&(!stmtTo||p.date<=stmtTo));
        // الجدول يعرض كل الحركات: نقدي + آجل + دفعات (إلا إذا تم اختيار إخفاء الفواتير النقدية)
        const custInvsForTimeline=stmtHideCash?custInvs.filter(i=>(i.notes||"").includes("[آجل]")):custInvs;
        // الرصيد يُحسب فقط على الآجل
        const timeline=[
          ...custInvsForTimeline.map(i=>({type:(i.notes||"").includes("[آجل]")?"credit_inv":"cash_inv",date:i.date,label:i.invoiceNo,amount:Number(i.total),obj:i})),
          ...custRets.map(i=>({type:"ret",date:i.date,label:i.invoiceNo,amount:Number(i.total),obj:i})),
          ...custPays.map(p=>({type:"pay",date:p.date,label:p.notes||"دفعة",amount:Number(p.amount),obj:p})),
        ].sort((a,b)=>a.date<b.date?-1:1);
        let running=0;
        const rows=timeline.map(r=>{
          if(r.type==="credit_inv") running+=r.amount;   // آجل يزيد الدين
          else if(r.type==="ret"){
            // المرتجع يُنقص الدين فقط لو الفاتورة الأصلية كانت آجل
            const srcNo=(r.obj.notes||"").replace("مرتجع من ","").trim();
            const srcInv=custInvs.find(i=>i.invoiceNo===srcNo);
            if(!srcInv||(srcInv.notes||"").includes("[آجل]")) running=Math.max(0,running-r.amount);
          }
          else if(r.type==="pay") running=Math.max(0,running-r.amount); // دفعة تنقص الدين
          // نقدي لا يأثر على الرصيد
          return{...r,balance:running};
        });
        const periodCreditTotal=custInvs.filter(i=>(i.notes||"").includes("[آجل]")).reduce((a,i)=>a+Number(i.total),0);
        const periodCashTotal=custInvs.filter(i=>!(i.notes||"").includes("[آجل]")).reduce((a,i)=>a+Number(i.total),0);
        const periodRets=custRets.reduce((a,i)=>a+Number(i.total),0);
        const periodPaid=custPays.reduce((a,p)=>a+Number(p.amount),0);
        const periodTotal=periodCreditTotal+periodCashTotal-periodRets;
        return(
        <Modal title={"كشف حساب: "+cst.name} sub={(cst.phone||"")+" · "+cst.count+" فاتورة"} onClose={()=>{setModal(null);setMd(null);setStmtFrom("");setStmtTo("");setStmtHideCash(false);}} wide>
          {/* إجماليات العميل الكلية */}
          <div style={{background:"#0B1120",border:"1px solid #1E2D45",borderRadius:10,padding:"12px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7A8EAE",marginBottom:8}}>📊 ملخص الحساب</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
                <span style={{color:"#B0C0D8"}}>📋 إجمالي الفواتير ({cst.count})</span>
                <span style={{fontWeight:700,color:"#3B82F6"}}>{fmt(cst.totalInvoiced)} ج.م</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{color:"#6B8AAF"}}>💵 نقدي</span>
                <span style={{color:"#10B981"}}>- {fmt(cst.cashInvoiced)} ج.م</span>
              </div>
              {cst.creditInvoiced>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{color:"#6B8AAF"}}>🕐 آجل</span>
                <span style={{color:"#F59E0B"}}>{fmt(cst.creditInvoiced)} ج.م</span>
              </div>}
              {cst.totalRetsC>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{color:"#6B8AAF"}}>↩️ مرتجعات</span>
                <span style={{color:"#F59E0B"}}>- {fmt(cst.totalRetsC)} ج.م</span>
              </div>}
              {cst.totalCreditPaid>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{color:"#6B8AAF"}}>💰 دفعات مسجلة</span>
                <span style={{color:"#10B981"}}>- {fmt(cst.totalCreditPaid)} ج.م</span>
              </div>}
              <div style={{display:"flex",justifyContent:"space-between",fontSize:14,borderTop:"1px solid #1E2D45",paddingTop:7,marginTop:2}}>
                <span style={{fontWeight:800,color:cst.remaining>0?"#EF4444":"#10B981"}}>💳 المتبقي</span>
                <span style={{fontWeight:800,color:cst.remaining>0?"#EF4444":"#10B981"}}>{fmt(cst.remaining)} ج.م</span>
              </div>
            </div>
          </div>

          {/* فلترة بالتاريخ */}
          <div style={{background:"#0B1120",border:"1px solid #1E2D45",borderRadius:9,padding:"10px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:"#7A8EAE",marginBottom:7}}>🔍 فلترة الكشف بالتاريخ</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:130}}>
                <div style={{fontSize:10,color:"#4A5E7A",marginBottom:3}}>من</div>
                <input type="date" value={stmtFrom} onChange={e=>setStmtFrom(e.target.value)} style={{width:"100%",padding:"6px 8px",borderRadius:7,border:"1.5px solid #1E2D45",background:"#131C2E",color:"#E2E8F0",fontSize:12,direction:"ltr"}}/>
              </div>
              <div style={{flex:1,minWidth:130}}>
                <div style={{fontSize:10,color:"#4A5E7A",marginBottom:3}}>إلى</div>
                <input type="date" value={stmtTo} onChange={e=>setStmtTo(e.target.value)} style={{width:"100%",padding:"6px 8px",borderRadius:7,border:"1.5px solid #1E2D45",background:"#131C2E",color:"#E2E8F0",fontSize:12,direction:"ltr"}}/>
              </div>
              {(stmtFrom||stmtTo)&&<button onClick={()=>{setStmtFrom("");setStmtTo("");}} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:"#6B8AAF",fontSize:11,padding:"6px 10px",alignSelf:"flex-end"}}>مسح</button>}
            </div>
            <label style={{display:"flex",alignItems:"center",gap:6,marginTop:9,cursor:"pointer",fontSize:11,color:"#7A8EAE"}}>
              <input type="checkbox" checked={stmtHideCash} onChange={e=>setStmtHideCash(e.target.checked)} style={{width:14,height:14,cursor:"pointer"}}/>
              🙈 إخفاء الفواتير المدفوعة نقدياً من الكشف والطباعة
            </label>
            {(stmtFrom||stmtTo)&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
                {[
                  {l:"إجمالي الفترة",v:fmt(periodTotal)+" ج.م",c:"#3B82F6"},
                  {l:"نقدي",v:fmt(periodCashTotal)+" ج.م",c:"#10B981"},
                  {l:"آجل",v:fmt(periodCreditTotal)+" ج.م",c:"#F59E0B"},
                  {l:"دفعات",v:fmt(periodPaid)+" ج.م",c:"#10B981"},
                  {l:"متبقي الفترة",v:fmt(Math.max(0,periodCreditTotal-periodRets-periodPaid))+" ج.م",c:periodCreditTotal-periodRets-periodPaid>0?"#EF4444":"#10B981"},
                ].map(s=>(
                  <div key={s.l} style={{flex:1,minWidth:80,background:"#1A2640",borderRadius:7,padding:"6px 8px",textAlign:"center"}}>
                    <div style={{fontSize:9,color:"#4A5E7A"}}>{s.l}</div>
                    <div style={{fontSize:11,fontWeight:800,color:s.c}}>{s.v}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* جدول الحركات */}
          <div style={{background:"#0B1120",borderRadius:10,overflow:"hidden",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:"#6B8AAF",padding:"8px 12px",borderBottom:"1px solid #1E2D45"}}>📋 كشف الحركات{(stmtFrom||stmtTo)?" (الفترة المحددة)":""}</div>
            <div style={{maxHeight:280,overflowY:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead><tr style={{background:"#131C2E",position:"sticky",top:0}}>
                  {["التاريخ","البيان","مدين","دائن","الرصيد",""].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"right",fontWeight:700,color:"#4A5E7A",borderBottom:"1px solid #1E2D45"}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {rows.map((r,i)=>(
                    <tr key={i} style={{borderBottom:"1px solid #0D1826",cursor:(r.type==="credit_inv"||r.type==="cash_inv"||r.type==="ret")?"pointer":"default"}}
                      onClick={()=>{if(r.type==="credit_inv"||r.type==="cash_inv"||r.type==="ret"){setMd(r.obj);setModal("vI");}}}
                      onMouseEnter={e=>{if(r.type==="credit_inv"||r.type==="cash_inv"||r.type==="ret")e.currentTarget.style.background="#1A2640";}}
                      onMouseLeave={e=>{e.currentTarget.style.background="";}}>
                      <td style={{padding:"7px 10px",color:"#6B8AAF"}}>{r.date}</td>
                      <td style={{padding:"7px 10px",color:r.type==="pay"?"#10B981":r.type==="ret"?"#F59E0B":r.type==="cash_inv"?"#6B8AAF":"#B0C0D8"}}>
                        {r.type==="pay"?"💵 دفعة: "+r.label:r.type==="ret"?"↩️ مرتجع: "+r.label:r.type==="cash_inv"?"💵 نقدي: "+r.label:"🕐 آجل: "+r.label}
                      </td>
                      <td style={{padding:"7px 10px",color:"#EF4444",fontWeight:700}}>{(r.type==="credit_inv"||r.type==="cash_inv")?fmt(r.amount)+" ج.م":"—"}</td>
                      <td style={{padding:"7px 10px",color:"#10B981",fontWeight:700}}>{(r.type==="pay"||r.type==="ret"||r.type==="cash_inv")?fmt(r.amount)+" ج.م":"—"}</td>
                      <td style={{padding:"7px 10px",fontWeight:800,color:r.balance>0?"#EF4444":"#10B981"}}>{fmt(Math.abs(r.balance))+" ج.م "+(r.balance>0?"⬆":"✓")}</td>
                      <td style={{padding:"7px 10px"}}>
                        {r.type==="pay"&&can("editCustomer")&&(
                          <div style={{display:"flex",gap:4}}>
                            <button onClick={e=>{e.stopPropagation();openEditCreditPayment(r.obj);}} title="تعديل الدفعة" style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:6,color:"#3B82F6",width:24,height:24,cursor:"pointer",fontSize:11}}>✏️</button>
                            <button onClick={e=>{e.stopPropagation();delCreditPayment(r.obj);}} title="حذف الدفعة" style={{background:"#1A0000",border:"1px solid #EF444433",borderRadius:6,color:"#EF4444",width:24,height:24,cursor:"pointer",fontSize:11}}>🗑️</button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                  {rows.length===0&&<tr><td colSpan={6} style={{padding:"24px",textAlign:"center",color:"#3A5070",fontSize:12}}>لا توجد حركات في هذه الفترة</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          {/* كشف الدفعات المستقلة */}
          {(()=>{
            const standalonePays=custPays.filter(p=>!p.invoice_no).sort((a,b)=>a.date<b.date?1:-1);
            const standaloneTotal=standalonePays.reduce((a,p)=>a+Number(p.amount),0);
            return(
              <div style={{background:"#0B1120",border:"1px solid #1E2D45",borderRadius:10,overflow:"hidden",marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:"1px solid #1E2D45"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#6B8AAF"}}>📑 كشف الدفعات المستقلة{(stmtFrom||stmtTo)?" (الفترة المحددة)":""}</div>
                  <div style={{fontSize:11,fontWeight:800,color:"#10B981"}}>الإجمالي: {fmt(standaloneTotal)} ج.م</div>
                </div>
                <div style={{maxHeight:200,overflowY:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead><tr style={{background:"#131C2E",position:"sticky",top:0}}>
                      {["التاريخ","ملاحظة","المبلغ",""].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"right",fontWeight:700,color:"#4A5E7A",borderBottom:"1px solid #1E2D45"}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {standalonePays.map(p=>(
                        <tr key={p.id} style={{borderBottom:"1px solid #0D1826"}}>
                          <td style={{padding:"7px 10px",color:"#6B8AAF"}}>{p.date}</td>
                          <td style={{padding:"7px 10px",color:"#B0C0D8"}}>{p.notes||"دفعة مستقلة"}</td>
                          <td style={{padding:"7px 10px",color:"#10B981",fontWeight:700}}>{fmt(p.amount)} ج.م</td>
                          <td style={{padding:"7px 10px"}}>
                            {can("editCustomer")&&(
                              <div style={{display:"flex",gap:4}}>
                                <button onClick={()=>openEditCreditPayment(p)} title="تعديل الدفعة" style={{background:"#1A2640",border:"1px solid #1E2D45",borderRadius:6,color:"#3B82F6",width:24,height:24,cursor:"pointer",fontSize:11}}>✏️</button>
                                <button onClick={()=>delCreditPayment(p)} title="حذف الدفعة" style={{background:"#1A0000",border:"1px solid #EF444433",borderRadius:6,color:"#EF4444",width:24,height:24,cursor:"pointer",fontSize:11}}>🗑️</button>
                              </div>
                            )}
                          </td>
                        </tr>
                      ))}
                      {standalonePays.length===0&&<tr><td colSpan={4} style={{padding:"18px",textAlign:"center",color:"#3A5070",fontSize:12}}>لا توجد دفعات مستقلة في هذه الفترة</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })()}

          {/* تسجيل دفعة - دايماً ظاهرة */}
          <div style={{background:"#0A1800",border:"1px solid #10B98133",borderRadius:10,padding:"12px",marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:800,color:"#10B981",marginBottom:8}}>💵 تسجيل دفعة {cst.remaining>0?"(متبقي: "+fmt(cst.remaining)+" ج.م)":"مستقلة"}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 8px"}}>
              <F label="المبلغ *" type="number" value={cpayForm.amount} onChange={e=>setCpayForm(p=>({...p,amount:e.target.value}))} placeholder="0" hint={cpayForm.amount&&cst.remaining>0?"متبقي بعد: "+fmt(Math.max(0,cst.remaining-+cpayForm.amount))+" ج.م":""}/>
              <F label="التاريخ" type="date" value={cpayForm.date} onChange={e=>setCpayForm(p=>({...p,date:e.target.value}))}/>
            </div>
            <F label="ملاحظة (اختياري)" value={cpayForm.notes} onChange={e=>setCpayForm(p=>({...p,notes:e.target.value}))} placeholder="مثال: دفع نقدي / دفعة مستقلة"/>
            <button onClick={()=>saveCreditPayment(cst.name)} disabled={busy} className="btn" style={{width:"100%",padding:"10px",background:busy?"#1A2640":"linear-gradient(135deg,#10B981,#059669)",color:"#fff",fontSize:13,borderRadius:10}}>
              {busy?"⏳ جاري الحفظ...":"💵 تسجيل الدفعة"}
            </button>
          </div>

          <div style={{display:"flex",gap:8}}>

              </tr></thead>

                    </tr>

            <div>مجموع الدائن: <strong style={{color:"#EF4444"}}>{fmt(jModal.viewLines.reduce((a,l)=>a+Number(l.credit),0))} ج.م</strong></div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={()=>printJournal(jModal,jModal.viewLines)} className="btn" style={{flex:1,padding:"9px",background:"linear-gradient(135deg,#3B82F6,#1D4ED8)",color:"#fff",fontSize:12}}>🖨️ طباعة</button>
            <button onClick={()=>exportJournalCSV(jModal,jModal.viewLines)} className="btn" style={{flex:1,padding:"9px",background:"linear-gradient(135deg,#10B981,#059669)",color:"#fff",fontSize:12}}>📥 تصدير</button>
            {!jModal.is_auto&&<button onClick={()=>openEditJournal(jModal,jModal.viewLines)} className="btn" style={{flex:1,padding:"9px",background:"linear-gradient(135deg,#F59E0B,#D97706)",color:"#fff",fontSize:12}}>✏️ تعديل</button>}
            {!jModal.is_auto&&<button onClick={()=>delJournal(jModal)} className="btn" style={{padding:"9px 14px",background:"#1A0000",border:"1px solid #EF444433",color:"#EF4444",fontSize:12}}>🗑️</button>}
          </div>
        </Modal>
      )}

      {/* EDIT JOURNAL ENTRY */}
      {editJForm&&(
        <Modal title="✏️ تعديل القيد اليومي" sub={editJForm.date} onClose={()=>setEditJForm(null)} wide>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px",marginBottom:8}}>
            <F label="التاريخ *" type="date" value={editJForm.date} onChange={e=>setEditJForm(p=>({...p,date:e.target.value}))}/>
            <div style={{gridColumn:"1/-1"}}><F label="وصف القيد *" value={editJForm.description} onChange={e=>setEditJForm(p=>({...p,description:e.target.value}))} placeholder="وصف القيد"/></div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontSize:12,fontWeight:800,color:"#D0D8F0"}}>بنود القيد *</div>
              <button onClick={()=>setEditJForm(p=>({...p,lines:[...p.lines,{accountId:"",debit:"",credit:"",note:""}]}))} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:"#3B82F6",fontSize:12,padding:"5px 11px"}}>+ سطر</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 28px",gap:6,marginBottom:4}}>
              {["الحساب","مدين","دائن","ملاحظة",""].map(h=><div key={h} style={{fontSize:10,color:"#4A5E7A",fontWeight:700,padding:"0 2px"}}>{h}</div>)}
            </div>
            {editJForm.lines.map((l,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 28px",gap:6,marginBottom:6}}>
                <select value={l.accountId} onChange={e=>setEditJForm(p=>({...p,lines:p.lines.map((x,idx)=>idx===i?{...x,accountId:e.target.value}:x)}))}
                  style={{padding:"7px 9px",borderRadius:8,border:"1.5px solid #1E2D45",background:"#0B1120",color:"#E2E8F0",fontSize:11,direction:"rtl"}}>
                  <option value="">— حساب —</option>
                  {Object.entries(ACCT_TYPES).map(([type,info])=>(
                    <optgroup key={type} label={info.icon+" "+info.label}>
                      {accounts.filter(a=>a.type===type).sort((a,b)=>a.code.localeCompare(b.code)).map(a=>(
                        <option key={a.id} value={a.id}>{a.code} — {a.name}</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
                <input type="number" min="0" value={l.debit} onChange={e=>setEditJForm(p=>({...p,lines:p.lines.map((x,idx)=>idx===i?{...x,debit:e.target.value,credit:e.target.value&&+e.target.value>0?"":x.credit}:x)}))}
                  placeholder="0" style={{padding:"7px 8px",borderRadius:8,border:"1.5px solid #1E2D45",background:l.debit&&+l.debit>0?"#0A1F0A":"#0B1120",color:"#10B981",fontSize:12,direction:"rtl"}}/>
                <input type="number" min="0" value={l.credit} onChange={e=>setEditJForm(p=>({...p,lines:p.lines.map((x,idx)=>idx===i?{...x,credit:e.target.value,debit:e.target.value&&+e.target.value>0?"":x.debit}:x)}))}
                  placeholder="0" style={{padding:"7px 8px",borderRadius:8,border:"1.5px solid #1E2D45",background:l.credit&&+l.credit>0?"#1A0000":"#0B1120",color:"#EF4444",fontSize:12,direction:"rtl"}}/>
                <input value={l.note} onChange={e=>setEditJForm(p=>({...p,lines:p.lines.map((x,idx)=>idx===i?{...x,note:e.target.value}:x)}))}
                  placeholder="ملاحظة" style={{padding:"7px 8px",borderRadius:8,border:"1.5px solid #1E2D45",background:"#0B1120",color:"#E2E8F0",fontSize:11,direction:"rtl"}}/>
                {editJForm.lines.length>2?<button onClick={()=>setEditJForm(p=>({...p,lines:p.lines.filter((_,idx)=>idx!==i)}))} style={{background:"#1A0000",border:"1px solid #EF444433",borderRadius:7,color:"#EF4444",width:28,height:34,cursor:"pointer",fontSize:14}}>×</button>:<div/>}
              </div>
            ))}
            {(()=>{
              const vl=editJForm.lines.filter(l=>l.accountId&&(+l.debit>0||+l.credit>0));
              const td=vl.reduce((a,l)=>a+(+l.debit||0),0);
              const tc=vl.reduce((a,l)=>a+(+l.credit||0),0);
              const balanced=Math.abs(td-tc)<0.01;
              return vl.length>=2&&<div style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",borderRadius:8,background:balanced?"#0A1F0A":"#1A0000",border:"1px solid "+(balanced?"#10B98133":"#EF444433"),fontSize:12,marginTop:4}}>
                <span style={{color:"#10B981"}}>مدين: {fmt(td)} ج.م</span>
                <span style={{color:balanced?"#10B981":"#EF4444",fontWeight:800}}>{balanced?"✓ متوازن":"⚠️ غير متوازن"}</span>
                <span style={{color:"#EF4444"}}>دائن: {fmt(tc)} ج.م</span>
              </div>;
            })()}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={saveEditJournal} disabled={busy} className="btn" style={{flex:2,padding:"12px",background:busy?"#1A2640":"linear-gradient(135deg,#F59E0B,#D97706)",color:"#fff",fontSize:14,borderRadius:12}}>
              {busy?"⏳ جاري الحفظ...":"💾 حفظ التعديلات"}
            </button>
            <button onClick={()=>setEditJForm(null)} className="btn" style={{flex:1,padding:"12px",background:"#1A2640",color:"#6B8AAF",fontSize:13,borderRadius:12}}>إلغاء</button>
          </div>
        </Modal>
      )}

      {/* CONTROL PANEL */}
      {modal==="settings"&&(
        <Modal title="⚙️ لوحة التحكم" sub={cpUnlocked?"تحكم في اسم المتجر، الشعار، والإعدادات العامة":"هذه اللوحة محمية بكلمة سر"} onClose={()=>setModal(null)}>
          {!cpUnlocked?(
            <div>
              <F label="كلمة سر لوحة التحكم" type="password" value={cpPass} onChange={e=>setCpPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkCpPass()}
                placeholder="••••••" style={{textAlign:"center",border:"1.5px solid "+(cpErr?"#EF4444":"#1E2D45")}}/>
              {cpErr&&<div style={{color:"#EF4444",fontSize:12,marginBottom:8,textAlign:"center"}}>كلمة السر غير صحيحة</div>}
              <button onClick={checkCpPass} className="btn" style={{width:"100%",padding:"11px",background:`linear-gradient(135deg,${settings.accentColor||"#3B82F6"},#7C3AED)`,color:"#fff",fontSize:14}}>دخول 🔓</button>
            </div>
          ):(
            <div>
              <F label="اسم المتجر" value={stForm.storeName} onChange={e=>setStForm(f=>({...f,storeName:e.target.value}))}/>
              <F label="الوصف التوضيحي (يظهر أسفل اسم المتجر)" value={stForm.tagline} onChange={e=>setStForm(f=>({...f,tagline:e.target.value}))}/>

              <div style={{marginBottom:12}}>
                <label style={{display:"block",fontSize:12,fontWeight:700,color:"#7A8EAE",marginBottom:6}}>شعار المتجر</label>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <div style={{width:48,height:48,borderRadius:10,background:"#0B1120",border:"1.5px solid #1E2D45",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,overflow:"hidden",flexShrink:0}}>
                    {stForm.logoImg?<img src={stForm.logoImg} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:stForm.logo}
                  </div>
                  <div style={{flex:1,display:"flex",gap:6}}>
                    <input ref={logoInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleLogoUpload(e.target.files[0])}/>
                    <button onClick={()=>logoInputRef.current?.click()} className="btn" style={{flex:1,background:"#1A2640",color:"#E2E8F0",fontSize:12,padding:"9px"}}>📤 رفع صورة</button>
                    {stForm.logoImg&&<button onClick={()=>setStForm(f=>({...f,logoImg:""}))} className="btn" style={{background:"#1A2640",color:"#EF4444",fontSize:12,padding:"9px 12px"}}>حذف</button>}
                  </div>
                </div>
                {!stForm.logoImg&&
                  <F label="أو اكتب إيموجي كشعار" value={stForm.logo} maxLength={4} onChange={e=>setStForm(f=>({...f,logo:e.target.value}))} style={{textAlign:"center",fontSize:20}}/>}
              </div>

              <F label="رمز العملة" value={stForm.currency} onChange={e=>setStForm(f=>({...f,currency:e.target.value}))} hint="مثال: ج.م"/>
              <TA label="نص ختام الفاتورة ورسائل واتساب" value={stForm.footer} onChange={e=>setStForm(f=>({...f,footer:e.target.value}))}/>

              {/* ── قسم: معلومات المتجر في الفواتير ── */}
              <div style={{borderTop:"1px solid #1E2D45",paddingTop:12,marginTop:4,marginBottom:4}}>
                <div style={{fontSize:12,fontWeight:800,color:"#3B82F6",marginBottom:10}}>🏢 معلومات المتجر في الفواتير</div>
                <F label="عنوان المتجر" value={stForm.storeAddress||""} onChange={e=>setStForm(f=>({...f,storeAddress:e.target.value}))} placeholder="مثال: شارع النصر، القاهرة"/>
                <F label="رقم الهاتف" value={stForm.storePhone||""} onChange={e=>setStForm(f=>({...f,storePhone:e.target.value}))} placeholder="مثال: 01012345678"/>
                <F label="الرقم الضريبي" value={stForm.storeTaxNo||""} onChange={e=>setStForm(f=>({...f,storeTaxNo:e.target.value}))} placeholder="مثال: 123-456-789"/>
              </div>

              {/* ── قسم: ترقيم وضريبة الفواتير ── */}
              <div style={{borderTop:"1px solid #1E2D45",paddingTop:12,marginTop:4,marginBottom:4}}>
                <div style={{fontSize:12,fontWeight:800,color:"#10B981",marginBottom:10}}>🧾 ترقيم وضريبة الفواتير</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
                  <F label="بادئة رقم الفاتورة" value={stForm.invoicePrefix||"INV"} onChange={e=>setStForm(f=>({...f,invoicePrefix:e.target.value}))} placeholder="INV" hint={"مثال: "+( stForm.invoicePrefix||"INV")+"-0001"}/>
                  <F label="نسبة الضريبة %" type="number" value={stForm.taxRate||"0"} onChange={e=>setStForm(f=>({...f,taxRate:e.target.value}))} placeholder="0" hint="0 = بدون ضريبة"/>
                </div>
              </div>

              {/* ── قسم: كلمة سر المدير ── */}
              <div style={{borderTop:"1px solid #1E2D45",paddingTop:12,marginTop:4,marginBottom:4}}>
                <div style={{fontSize:12,fontWeight:800,color:"#F59E0B",marginBottom:10}}>👑 كلمة سر المدير</div>
                <F label="كلمة سر المدير (الدخول الرئيسي)" type="text" value={stForm.loginPassword||""} onChange={e=>setStForm(f=>({...f,loginPassword:e.target.value}))}
                  placeholder="اتركها فارغة للإبقاء على الحالية" hint={settings.loginPassword?"محدّدة حالياً":"الافتراضية: amir1234"}/>
                <F label="كلمة سر لوحة التحكم ⚙️" type="text" value={stForm.adminPassword||""} onChange={e=>setStForm(f=>({...f,adminPassword:e.target.value}))}
                  placeholder="اتركها فارغة للإبقاء على الحالية" hint={settings.adminPassword?"محدّدة حالياً":"الافتراضية: mo1234"}/>
              </div>

              {/* ── قسم: إدارة اليوزرات ── */}
              <div style={{borderTop:"1px solid #1E2D45",paddingTop:12,marginTop:4,marginBottom:4}}>
                <div style={{fontSize:12,fontWeight:800,color:"#06B6D4",marginBottom:10}}>👥 إدارة اليوزرات</div>
                {/* قائمة اليوزرات الحالية */}
                {(stForm.users||[]).length===0&&<div style={{fontSize:12,color:"#3A5070",marginBottom:10,textAlign:"center",padding:"12px",background:"#0B1120",borderRadius:10,border:"1px solid #1E2D45"}}>لا يوجد يوزرات مضافة بعد. أضف يوزر جديد أدناه.</div>}
                {(stForm.users||[]).map(u=>(
                  <div key={u.id} style={{background:"#0B1120",border:"1px solid "+(editingUser?.id===u.id?"#3B82F6":"#1E2D45"),borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:editingUser?.id===u.id?10:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{width:32,height:32,borderRadius:8,background:(u.color||"#3B82F6")+"22",border:"1px solid "+(u.color||"#3B82F6")+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{u.icon||"👤"}</div>

                          <div style={{fontSize:13,fontWeight:800,color:"#E2E8F0"}}>{u.name}</div>
                          <div style={{fontSize:10,color:"#4A5E7A"}}>كلمة السر: {u.password?"••••••":"(فارغة)"}</div>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>{
                          if(editingUser?.id===u.id){setEditingUser(null);}
                          else{setEditingUser({...u});setEditUserPerms(mergeUserPerms(u.permissions));}
                        }} className="btn" style={{background:editingUser?.id===u.id?"#1A2640":"#1A2640",border:"1px solid "+(editingUser?.id===u.id?"#3B82F6":"#1E2D45"),color:editingUser?.id===u.id?"#3B82F6":"#6B8AAF",fontSize:11,padding:"5px 10px"}}>
                          {editingUser?.id===u.id?"إغلاق":"✏️ تعديل"}
                        </button>
                        <button onClick={()=>{
                          if(!confirm("حذف يوزر «"+u.name+"»؟"))return;
                          setStForm(f=>({...f,users:(f.users||[]).filter(x=>x.id!==u.id)}));
                          if(editingUser?.id===u.id)setEditingUser(null);
                        }} className="btn" style={{background:"#1A0000",border:"1px solid #EF444433",color:"#EF4444",fontSize:11,padding:"5px 10px"}}>🗑️</button>
                      </div>
                    </div>
                    {/* منطقة تعديل اليوزر */}
                    {editingUser?.id===u.id&&(()=>{
                      const eu=editingUser;
                      const saveEdit=()=>{
                        setStForm(f=>({...f,users:(f.users||[]).map(x=>x.id===eu.id?{...eu,permissions:editUserPerms}:x)}));
                        setEditingUser(null);
                      };
                      return(
                        <div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
                            <F label="الاسم" value={eu.name} onChange={e=>setEditingUser(x=>({...x,name:e.target.value}))}/>
                            <F label="كلمة السر" type="text" value={eu.password} onChange={e=>setEditingUser(x=>({...x,password:e.target.value}))} placeholder="اكتب كلمة سر"/>
                          </div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
                            <F label="إيموجي الأيقونة" value={eu.icon||"👤"} maxLength={4} onChange={e=>setEditingUser(x=>({...x,icon:e.target.value}))} style={{textAlign:"center",fontSize:18}}/>
                            <div style={{marginBottom:12}}>
                              <label style={{fontSize:12,fontWeight:700,color:"#7A8EAE",display:"block",marginBottom:6}}>اللون</label>
                              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                                {["#3B82F6","#10B981","#7C3AED","#F59E0B","#EF4444","#06B6D4","#EC4899"].map(c=>(
                                  <div key={c} onClick={()=>setEditingUser(x=>({...x,color:c}))} style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",border:(eu.color||"#3B82F6")===c?"3px solid #fff":"3px solid transparent",flexShrink:0}}/>
                                ))}
                              </div>
                            </div>
                          </div>
                          {/* صلاحيات هذا اليوزر */}
                          <div style={{fontSize:11,fontWeight:800,color:"#9CB4D8",marginBottom:8}}>🔒 الصلاحيات</div>
                          {PERMISSION_GROUPS.map(g=>{
                            const allOn=g.perms.every(p=>editUserPerms[p.key]);
                            return(
                              <div key={g.title} style={{background:"#131C2E",border:"1px solid #1E2D45",borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                                  <div style={{fontSize:11,fontWeight:800,color:"#9CB4D8"}}>{g.icon} {g.title}</div>
                                  <button onClick={()=>{const upd={...editUserPerms};g.perms.forEach(p=>{upd[p.key]=!allOn;});setEditUserPerms(upd);}} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:allOn?"#EF4444":"#10B981",fontSize:10,padding:"3px 8px"}}>
                                    {allOn?"إلغاء الكل":"تحديد الكل"}
                                  </button>
                                </div>
                                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 8px"}}>
                                  {g.perms.map(p=>{
                                    const on=!!editUserPerms[p.key];
                                    return(
                                      <label key={p.key} onClick={()=>setEditUserPerms(x=>({...x,[p.key]:!x[p.key]}))} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",padding:"5px 6px",borderRadius:6,background:on?(eu.color||"#3B82F6")+"14":"transparent"}}>
                                        <div style={{width:30,height:17,borderRadius:99,background:on?(eu.color||"#3B82F6"):"#1E2D45",position:"relative",flexShrink:0,transition:"all .15s"}}>
                                          <div style={{width:13,height:13,borderRadius:"50%",background:"#fff",position:"absolute",top:2,right:on?2:15,transition:"all .15s"}}/>
                                        </div>
                                        <span style={{fontSize:11,color:on?"#E2E8F0":"#6B8AAF"}}>{p.label}</span>
                                      </label>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })}
                          <button onClick={saveEdit} className="btn" style={{width:"100%",padding:"9px",background:"linear-gradient(135deg,#3B82F6,#7C3AED)",color:"#fff",fontSize:13,marginTop:4}}>✓ حفظ تعديلات هذا اليوزر</button>
                        </div>
                      );
                    })()}
                  </div>
                ))}
                {/* إضافة يوزر جديد */}
                <div style={{background:"#0B1120",border:"1px dashed #1E2D45",borderRadius:10,padding:"12px",marginTop:4}}>
                  <div style={{fontSize:12,fontWeight:800,color:"#10B981",marginBottom:10}}>➕ إضافة يوزر جديد</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
                    <F label="الاسم" value={newUserForm.name} onChange={e=>setNewUserForm(f=>({...f,name:e.target.value}))} placeholder="مثال: أحمد كاشير"/>
                    <F label="كلمة السر" type="text" value={newUserForm.password} onChange={e=>setNewUserForm(f=>({...f,password:e.target.value}))} placeholder="اكتب كلمة سر"/>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 10px"}}>
                    <F label="إيموجي الأيقونة" value={newUserForm.icon} maxLength={4} onChange={e=>setNewUserForm(f=>({...f,icon:e.target.value}))} style={{textAlign:"center",fontSize:18}}/>
                    <div style={{marginBottom:12}}>
                      <label style={{fontSize:12,fontWeight:700,color:"#7A8EAE",display:"block",marginBottom:6}}>اللون</label>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                        {["#3B82F6","#10B981","#7C3AED","#F59E0B","#EF4444","#06B6D4","#EC4899"].map(c=>(
                          <div key={c} onClick={()=>setNewUserForm(f=>({...f,color:c}))} style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",border:newUserForm.color===c?"3px solid #fff":"3px solid transparent",flexShrink:0}}/>
                        ))}
                      </div>
                    </div>
                  </div>
                  {/* صلاحيات اليوزر الجديد */}
                  <div style={{fontSize:11,fontWeight:800,color:"#9CB4D8",marginBottom:8}}>🔒 الصلاحيات</div>
                  {PERMISSION_GROUPS.map(g=>{
                    const allOn=g.perms.every(p=>newUserPerms[p.key]);
                    return(
                      <div key={g.title} style={{background:"#131C2E",border:"1px solid #1E2D45",borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                          <div style={{fontSize:11,fontWeight:800,color:"#9CB4D8"}}>{g.icon} {g.title}</div>
                          <button onClick={()=>{const upd={...newUserPerms};g.perms.forEach(p=>{upd[p.key]=!allOn;});setNewUserPerms(upd);}} className="btn" style={{background:"#1A2640",border:"1px solid #1E2D45",color:allOn?"#EF4444":"#10B981",fontSize:10,padding:"3px 8px"}}>
                            {allOn?"إلغاء الكل":"تحديد الكل"}
                          </button>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 8px"}}>
                          {g.perms.map(p=>{
                            const on=!!newUserPerms[p.key];
                            return(
                              <label key={p.key} onClick={()=>setNewUserPerms(x=>({...x,[p.key]:!x[p.key]}))} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",padding:"5px 6px",borderRadius:6,background:on?(newUserForm.color||"#3B82F6")+"14":"transparent"}}>
                                <div style={{width:30,height:17,borderRadius:99,background:on?(newUserForm.color||"#3B82F6"):"#1E2D45",position:"relative",flexShrink:0,transition:"all .15s"}}>
                                  <div style={{width:13,height:13,borderRadius:"50%",background:"#fff",position:"absolute",top:2,right:on?2:15,transition:"all .15s"}}/>
                                </div>
                                <span style={{fontSize:11,color:on?"#E2E8F0":"#6B8AAF"}}>{p.label}</span>
                              </label>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                  <button onClick={()=>{
                    if(!newUserForm.name.trim()){alert("أدخل اسم اليوزر");return;}
                    const id="user_"+Date.now();
                    const newU={id,name:newUserForm.name.trim(),password:newUserForm.password,icon:newUserForm.icon||"👤",color:newUserForm.color||"#3B82F6",isManager:false,permissions:{...newUserPerms}};
                    setStForm(f=>({...f,users:[...(f.users||[]),newU]}));
                    setNewUserForm({name:"",password:"",icon:"👤",color:"#3B82F6"});
                    setNewUserPerms(BLANK_PERMS());
                  }} className="btn" style={{width:"100%",padding:"9px",background:"linear-gradient(135deg,#10B981,#059669)",color:"#fff",fontSize:13,marginTop:4}}>
                    ➕ إضافة اليوزر
                  </button>
                </div>
                <div style={{fontSize:10,color:"#3A5070",marginTop:8}}>💡 المدير دائماً له صلاحيات كاملة. اضغط «✓ حفظ الإعدادات» أدناه لحفظ كل التغييرات على جميع الأجهزة.</div>
              </div>

              {/* ── قسم: ألوان التطبيق ── */}
              <div style={{borderTop:"1px solid #1E2D45",paddingTop:12,marginTop:4,marginBottom:4}}>
                <div style={{fontSize:12,fontWeight:800,color:"#7C3AED",marginBottom:10}}>🎨 لون التطبيق</div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                  {["#3B82F6","#10B981","#7C3AED","#F59E0B","#EF4444","#06B6D4","#EC4899","#F97316"].map(c=>(
                    <div key={c} onClick={()=>setStForm(f=>({...f,accentColor:c}))} style={{width:28,height:28,borderRadius:"50%",background:c,cursor:"pointer",border:stForm.accentColor===c?"3px solid #fff":"3px solid transparent",boxSizing:"border-box",flexShrink:0}}/>
                  ))}
                  <input type="color" value={stForm.accentColor||"#3B82F6"} onChange={e=>setStForm(f=>({...f,accentColor:e.target.value}))} style={{width:28,height:28,border:"none",borderRadius:"50%",cursor:"pointer",padding:0,background:"none"}} title="لون مخصص"/>
                </div>
              </div>

              <div style={{display:"flex",gap:8,marginTop:6}}>
                <button onClick={saveSettings} className="btn" style={{flex:2,padding:"12px",background:"linear-gradient(135deg,#10B981,#059669)",color:"#fff",fontSize:14}}>✓ حفظ الإعدادات</button>
                <button onClick={resetSettings} className="btn" style={{flex:1,padding:"12px",background:"#1A2640",color:"#6B8AAF",fontSize:13}}>استعادة الافتراضي</button>
              </div>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
